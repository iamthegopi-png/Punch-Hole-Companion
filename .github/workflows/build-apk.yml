                      charMode = prefs.getString("char_mode", "rotate") ?: "rotate"
                      if (charMode != "rotate") activeCharIdx = charMode.toIntOrNull() ?: 0
                      visitIntervalSec = prefs.getInt("visit_sec", 120)
                      visitCountdown = visitIntervalSec
                      camTopOffsetDp = prefs.getInt("cam_y", 6).toFloat()
                      camLeftOffsetDp = prefs.getInt("cam_x", 0).toFloat()
                      bubbleDisplaySec = prefs.getInt("read_sec", 9)
                      textSizeSp = prefs.getInt("text_sp", 16)
                      targetRopeRatio = prefs.getInt("rope_pct", 28) / 100f
                      fallAnimationEnabled = prefs.getBoolean("fall_on", true)
                      quotesEnabled = prefs.getBoolean("quotes_on", true)
                  }
                  root.addView(previewView, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))

                  val restoreBtn = Button(this).apply {
                      text = "Settings ⚙️"; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      background = roundedBg("#D90A0D1C", "#33FFFFFF", 99f); visibility = View.GONE; setPadding(dp(16), dp(8), dp(16), dp(8))
                  }

                  val dockScroll = ScrollView(this).apply {
                      isVerticalScrollBarEnabled = false; background = roundedBg("#E60A0D1C", "#29FFFFFF", 22f); setPadding(dp(15), dp(12), dp(15), dp(12))
                  }
                  val dock = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  dockScroll.addView(dock)

                  // Header Row with Quotes: ON/OFF & Fall: ON/OFF
                  val topRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val titleTv = TextView(this).apply {
                      text = "Companion v4.0"; setTextColor(Color.WHITE); setTypeface(typeface, Typeface.BOLD); setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val quotesBtn = Button(this).apply {
                      val qOn = previewView.quotesEnabled
                      text = if (qOn) "Quotes: ON" else "Quotes: OFF"
                      setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f)
                      background = roundedBg(if (qOn) "#4010B981" else "#1FFFFFFF", "#10B981", 99f)
                      setOnClickListener {
                          previewView.quotesEnabled = !previewView.quotesEnabled
                          prefs.edit().putBoolean("quotes_on", previewView.quotesEnabled).apply()
                          text = if (previewView.quotesEnabled) "Quotes: ON" else "Quotes: OFF"
                          background = roundedBg(if (previewView.quotesEnabled) "#4010B981" else "#1FFFFFFF", "#10B981", 99f)
                          if (previewView.quotesEnabled) previewView.speakWisdom("random") else { previewView.rebuildBubbleLayouts(); previewView.invalidate() }
                      }
                  }
                  val fallBtn = Button(this).apply {
                      val isOn = previewView.fallAnimationEnabled
                      text = if (isOn) "Fall: ON" else "Fall: OFF"
                      setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f)
                      background = roundedBg(if (isOn) "#4010B981" else "#1FFFFFFF", "#10B981", 99f)
                      setOnClickListener {
                          previewView.fallAnimationEnabled = !previewView.fallAnimationEnabled
                          prefs.edit().putBoolean("fall_on", previewView.fallAnimationEnabled).apply()
                          text = if (previewView.fallAnimationEnabled) "Fall: ON" else "Fall: OFF"
                          background = roundedBg(if (previewView.fallAnimationEnabled) "#4010B981" else "#1FFFFFFF", "#10B981", 99f)
                      }
                  }
                  val hideBtn = Button(this).apply {
                      text = "Hide"; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f)
                      background = roundedBg("#1FFFFFFF", "#29FFFFFF", 99f)
                      setOnClickListener { dockScroll.visibility = View.GONE; restoreBtn.visibility = View.VISIBLE }
                  }
                  restoreBtn.setOnClickListener { dockScroll.visibility = View.VISIBLE; restoreBtn.visibility = View.GONE }

                  topRow.addView(titleTv)
                  topRow.addView(quotesBtn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(30)).apply { rightMargin = dp(4) })
                  topRow.addView(fallBtn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(30)).apply { rightMargin = dp(4) })
                  topRow.addView(hideBtn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(30)))
                  dock.addView(topRow)

                  dock.addView(makeSectionLabel("Active Friend (Tap friend for 360° Flip & Tricks!)"))
                  val charRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val charOptions = listOf("rotate" to "🔄 All", "0" to "🥷 Ninja", "1" to "🐱 Cat", "2" to "🤖 Bot", "3" to "🦊 Fox")
                  val charButtons = mutableListOf<Pair<String, Button>>()
                  for ((key, label) in charOptions) {
                      val btn = Button(this).apply {
                          text = label; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f); setPadding(dp(4), dp(4), dp(4), dp(4))
                          setOnClickListener {
                              previewView.charMode = key
                              if (key != "rotate") previewView.activeCharIdx = key.toInt()
                              prefs.edit().putString("char_mode", key).apply()
                              previewView.triggerShowstopperTrick(forceFlip = true)
                              if (previewView.state == CompanionOverlayView.State.PERCHED && previewView.quotesEnabled) previewView.speakWisdom("random")
                              charButtons.forEach { (k, b) -> b.background = roundedBg(if (k == key) "#E01937" else "#14FFFFFF", "#24FFFFFF", 9f) }
                          }
                      }
                      btn.background = roundedBg(if (key == previewView.charMode) "#E01937" else "#14FFFFFF", "#24FFFFFF", 9f)
                      charButtons.add(key to btn)
                      charRow.addView(btn, LinearLayout.LayoutParams(0, dp(32), 1f).apply { rightMargin = dp(4) })
                  }
                  dock.addView(charRow)

                  dock.addView(makeSectionLabel("Visit Frequency"))
                  val freqRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val freqOptions = listOf(0 to "Always", 30 to "30s", 60 to "1m", 120 to "2m", 180 to "3m", 300 to "5m")
                  val freqButtons = mutableListOf<Pair<Int, Button>>()
                  for ((sec, label) in freqOptions) {
                      val btn = Button(this).apply {
                          text = label; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10f); setPadding(dp(2), dp(4), dp(2), dp(4))
                          setOnClickListener {
                              previewView.visitIntervalSec = sec; previewView.visitCountdown = sec
                              prefs.edit().putInt("visit_sec", sec).apply()
                              if (sec == 0 && previewView.state == CompanionOverlayView.State.INSIDE) previewView.deployCompanion(false)
                              freqButtons.forEach { (s, b) -> b.background = roundedBg(if (s == sec) "#E01937" else "#14FFFFFF", "#24FFFFFF", 9f) }
                          }
                      }
                      btn.background = roundedBg(if (sec == previewView.visitIntervalSec) "#E01937" else "#14FFFFFF", "#24FFFFFF", 9f)
                      freqButtons.add(sec to btn)
                      freqRow.addView(btn, LinearLayout.LayoutParams(0, dp(32), 1f).apply { rightMargin = dp(4) })
                  }
                  dock.addView(freqRow)

                  addSlider(dock, "Bubble Text Size (Readability)", 12, 22, previewView.textSizeSp, "sp") { v ->
                      previewView.textSizeSp = v; prefs.edit().putInt("text_sp", v).apply(); previewView.rebuildBubbleLayouts(); previewView.invalidate()
                  }
                  addSlider(dock, "Bubble Reading Time", 4, 20, previewView.bubbleDisplaySec, "s") { v ->
                      previewView.bubbleDisplaySec = v; prefs.edit().putInt("read_sec", v).apply()
                  }
                  addSlider(dock, "Camera Hole Y-Position", 0, 55, previewView.camTopOffsetDp.toInt(), "px") { v ->
                      previewView.camTopOffsetDp = v.toFloat(); prefs.edit().putInt("cam_y", v).apply(); previewView.invalidate()
                  }
                  addSlider(dock, "Camera Hole X-Offset", -60, 60, previewView.camLeftOffsetDp.toInt(), "px") { v ->
                      previewView.camLeftOffsetDp = v.toFloat(); prefs.edit().putInt("cam_x", v).apply(); previewView.invalidate()
                  }
                  addSlider(dock, "Rope Drop Depth", 16, 48, (previewView.targetRopeRatio * 100).toInt(), "%") { v ->
                      previewView.targetRopeRatio = v / 100f; prefs.edit().putInt("rope_pct", v).apply(); previewView.invalidate()
                  }

                  val actRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, dp(6), 0, 0) }
                  actRow.addView(makeActionButton("In / Out", "#E01937") { previewView.toggleCompanion() }, LinearLayout.LayoutParams(0, dp(36), 1f).apply { rightMargin = dp(5) })
                  actRow.addView(makeActionButton("Do Trick ✨", "#1AFFFFFF") {
                      if (previewView.state == CompanionOverlayView.State.INSIDE) previewView.deployCompanion(false)
                      previewView.triggerShowstopperTrick(forceFlip = true)
                  }, LinearLayout.LayoutParams(0, dp(36), 1f).apply { rightMargin = dp(5) })
                  actRow.addView(makeActionButton("Quote 🧠", "#1AFFFFFF") {
                      if (previewView.state == CompanionOverlayView.State.INSIDE) previewView.deployCompanion(false)
                      previewView.quotesEnabled = true; prefs.edit().putBoolean("quotes_on", true).apply()
                      quotesBtn.text = "Quotes: ON"; quotesBtn.background = roundedBg("#4010B981", "#10B981", 99f)
                      previewView.postDelayed({ previewView.speakWisdom("random") }, 300L)
                  }, LinearLayout.LayoutParams(0, dp(36), 1f).apply { rightMargin = dp(5) })
                  actRow.addView(makeActionButton("Gyro ON", "#1AFFFFFF") { gyroActive = !gyroActive; updateActivitySensor() }, LinearLayout.LayoutParams(0, dp(36), 1f))
                  dock.addView(actRow)

                  val bottomRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, dp(8), 0, 0) }
                  overlayBtn = makeActionButton(if (OverlayService.isRunning) "Stop Overlay ⏹️" else "Float Over Apps 📌", "#10B981", Color.parseColor("#052E16")) { toggleSystemOverlay() }
                  bottomRow.addView(overlayBtn, LinearLayout.LayoutParams(0, dp(38), 1.5f).apply { rightMargin = dp(6) })
                  bottomRow.addView(makeActionButton("Keep Alive ⚡", "#1AFFFFFF") { requestBatteryExemption() }, LinearLayout.LayoutParams(0, dp(38), 1f))
                  dock.addView(bottomRow)

                  root.addView(dockScroll, FrameLayout.LayoutParams(minOf(resources.displayMetrics.widthPixels - dp(20), dp(410)), ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL; bottomMargin = dp(14)
                  })
                  root.addView(restoreBtn, FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      gravity = Gravity.BOTTOM or Gravity.END; bottomMargin = dp(20); rightMargin = dp(16)
                  })
                  setContentView(root)
              }

              private fun makeSectionLabel(txt: String): TextView = TextView(this).apply {
                  text = txt; setTextColor(Color.argb(210, 255, 255, 255)); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f); setTypeface(typeface, Typeface.BOLD); setPadding(0, dp(5), 0, dp(3))
              }

              private fun makeActionButton(label: String, bgHex: String, textColor: Int = Color.WHITE, onClick: () -> Unit): Button = Button(this).apply {
                  text = label; setTextColor(textColor); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f); setTypeface(typeface, Typeface.BOLD)
                  background = roundedBg(bgHex, "#24FFFFFF", 10f); setOnClickListener { onClick() }
              }

              private fun addSlider(parent: LinearLayout, title: String, minVal: Int, maxVal: Int, initVal: Int, unit: String, onChange: (Int) -> Unit) {
                  val header = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, dp(3), 0, 0) }
                  val labelTv = TextView(this).apply { text = title; setTextColor(Color.argb(210, 255, 255, 255)); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f); layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f) }
                  val valTv = TextView(this).apply { text = "$initVal$unit"; setTextColor(Color.parseColor("#6EE7B7")); setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f); setTypeface(typeface, Typeface.BOLD) }
                  header.addView(labelTv); header.addView(valTv); parent.addView(header)
                  parent.addView(SeekBar(this).apply {
                      max = maxVal - minVal; progress = (initVal - minVal).coerceIn(0, maxVal - minVal)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, p: Int, fromUser: Boolean) { val actual = minVal + p; valTv.text = "$actual$unit"; onChange(actual) }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  })
              }

              private fun toggleSystemOverlay() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))); return
                  }
                  val svc = Intent(this, OverlayService::class.java)
                  if (OverlayService.isRunning) {
                      prefs.edit().putBoolean("overlay_running", false).apply(); stopService(svc); overlayBtn.text = "Float Over Apps 📌"
                  } else {
                      prefs.edit().putBoolean("overlay_running", true).apply()
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc) else startService(svc)
                      overlayBtn.text = "Stop Overlay ⏹️"
                  }
              }

              private fun requestBatteryExemption() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply { data = Uri.parse("package:$packageName") })
                      }
                  }
              }

              private fun updateActivitySensor() {
                  val sm = sensorManager ?: return
                  if (gyroActive) sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) }
                  else { sm.unregisterListener(this); previewView.phoneTiltDeg = 0f }
              }

              override fun onResume() { super.onResume(); overlayBtn.text = if (OverlayService.isRunning) "Stop Overlay ⏹️" else "Float Over Apps 📌"; if (gyroActive) updateActivitySensor() }
              override fun onPause() { sensorManager?.unregisterListener(this); super.onPause() }
              override fun onSensorChanged(event: SensorEvent?) { if (event?.sensor?.type == Sensor.TYPE_ACCELEROMETER) previewView.phoneTiltDeg = (-event.values[0] * 4.2f).coerceIn(-40f, 40f) }
              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }
          EOF

      - name: Build Unsigned Release APK
        run: |
          chmod +x gradlew || true
          gradle assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Sign & Align Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-output
          KS_PASS="${KEYSTORE_PASSWORD:-companion123}"
          K_ALIAS="${KEY_ALIAS:-companion}"
          K_PASS="${KEY_PASSWORD:-companion123}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          else
            keytool -genkeypair -v -keystore release.jks -alias "$K_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$K_PASS" -dname "CN=PunchHoleCompanion, OU=Mobile, O=Companion, L=City, S=State, C=IN"
            base64 -w 0 release.jks > release-output/keystore-base64.txt
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="release-output/app-release-aligned.apk"
          SIGNED_APK="release-output/PunchHoleCompanion-release-signed.apk"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-key-alias "$K_ALIAS" --ks-pass pass:"$KS_PASS" --key-pass pass:"$K_PASS" --out "$SIGNED_APK" "$ALIGNED_APK"
          rm -f "$ALIGNED_APK"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PunchHoleCompanion-Kotlin-Release-APK
          path: release-output/
