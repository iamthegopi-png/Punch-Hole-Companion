          package com.companion.punchhole

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (Intent.ACTION_BOOT_COMPLETED == intent.action) {
                      val prefs = context.getSharedPreferences(OverlayService.PREFS_NAME, Context.MODE_PRIVATE)
                      if (prefs.getBoolean("overlay_running", false) && Settings.canDrawOverlays(context)) {
                          val svc = Intent(context, OverlayService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(svc) else context.startService(svc)
                      }
                  }
              }
          }
