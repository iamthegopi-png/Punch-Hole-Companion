name: Build Pure Kotlin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Align Android SDK Paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Kotlin Android Project & Source Files
        run: |
          rm -rf android build.gradle settings.gradle app
          mkdir -p app/src/main/java/com/companion/punchhole
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PunchHoleCompanionKotlin"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.companion.punchhole"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.companion.punchhole"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0-kotlin"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Punch Hole Companion"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|density|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="persistent_punch_hole_companion_overlay" />
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#3F46CC" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#141722" android:pathData="M52,18h4v42h-4z"/>
              <path android:fillColor="#090B10" android:pathData="M54,58m-18,0a18,18 0,1 1,36 0a18,18 0,1 1,-36 0"/>
              <path android:fillColor="#E11D48" android:pathData="M36,52h36v6h-36z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M45,59h6v3h-6zM57,59h6v3h-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/java/com/companion/punchhole/WisdomRepository.kt
          package com.companion.punchhole

          import java.util.Calendar
          import kotlin.random.Random

          data class WisdomItem(val categoryBadge: String, val title: String?, val body: String)

          object WisdomRepository {
              private val motivation = listOf(
                  "Focus on the next micro-step. Momentum builds action! ⚡",
                  "Discipline is choosing between what you want now and what you want most.",
                  "Your future self is depending on the work you put in today.",
                  "Action cures anxiety. Dive into your task for just 5 minutes!",
                  "Take a deep breath. You are far more capable than you realize.",
                  "Small daily improvements over time lead to stunning results.",
                  "Energy flows where attention goes. Guard your focus fiercely.",
                  "Amateurs sit and wait for inspiration; pros get up and go to work.",
                  "Do the hardest task first thing. Everything else feels effortless after.",
                  "Consistency beats intensity. Show up today, even if it's small."
              )
              private val workChecks = listOf(
                  "Time for a deep work sprint! Put your phone face down and crush it for 25 minutes. 💻",
                  "Stand up, roll your shoulders back, take 3 deep breaths, and reset your posture! 🌟",
                  "Break your big project into three tiny tasks. Which one starts right now?",
                  "Clear your workspace and close extra tabs. A clean space creates a sharp mind.",
                  "Single-tasking is a superpower. Do one thing right now with 100% presence.",
                  "Drink a glass of water! Even 2% dehydration drops cognitive focus by 15%."
              )
              private val psychPrinciples = listOf(
                  "Benjamin Franklin Effect" to "Want someone to like you? Ask them for a small favor. Our brains justify helping someone by deciding we like them.",
                  "Foot-in-the-Door" to "To achieve a massive goal or agreement, start with a tiny request first. Momentum snowballs naturally.",
                  "The Zeigarnik Effect" to "Your brain remembers unfinished tasks far better than completed ones. Simply starting for 2 minutes silences procrastination!",
                  "The 2-Minute Rule" to "If a task takes less than 2 minutes to do, do it immediately instead of scheduling it. It eliminates mental clutter.",
                  "Social Proof" to "We unconsciously mirror the habits of our peers. Surround yourself with focused, driven people to elevate your baseline.",
                  "The Pygmalion Effect" to "Higher expectations directly lead to higher performance—both in how you treat others and how you view yourself.",
                  "Scarcity Principle" to "People value things more when availability is limited. Treat your time and attention as your scarcest assets.",
                  "Reciprocity Norm" to "Giving value, kindness, or recognition first creates a natural psychological desire for others to reciprocate.",
                  "Tactical Silence" to "In negotiations or deep conversations, pause for 4 seconds after someone speaks. They will often reveal the real truth."
              )
              private val cognitiveBiases = listOf(
                  "Dunning-Kruger Effect" to "Beginners often overestimate their skill, while experts underestimate theirs. Stay curious and keep learning!",
                  "Confirmation Bias" to "Our brains filter for evidence that agrees with us. Actively ask: 'What would prove my current belief wrong?'",
                  "Loss Aversion" to "Losing $100 hurts twice as much as gaining $100 feels good. Don't let fear of a small loss stop a smart risk.",
                  "Anchoring Bias" to "We rely too heavily on the first number or idea we hear. Always reset and evaluate value from scratch.",
                  "Sunk Cost Fallacy" to "Continuing a bad project just because you already spent time or money on it. Only future value matters!",
                  "Attribution Error" to "We judge others by their character, but excuse ourselves by our situation. Practice generous empathy.",
                  "Availability Heuristic" to "We judge probability by how easily examples pop into memory. Look at real statistics, not dramatic headlines."
              )
              private val stoicMaxims = listOf(
                  "Marcus Aurelius" to "'The impediment to action advances action. What stands in the way becomes the way.'",
                  "Seneca on Time" to "'It is not that we have a short time to live, but that we waste a lot of it.'",
                  "Aristotle" to "'We are what we repeatedly do. Excellence, then, is not an act, but a habit.'",
                  "Carl Jung" to "'Until you make the unconscious conscious, it will direct your life and you will call it fate.'",
                  "Epictetus" to "'Make the best use of what is in your power, and take the rest as it happens.'",
                  "Viktor Frankl" to "'Between stimulus and response there is a space. In that space is our power to choose our response.'",
                  "Seneca on Fear" to "'We suffer more often in imagination than in reality.'",
                  "Marcus Aurelius" to "'You have power over your mind—not outside events. Realize this, and you will find strength.'"
              )
              private val mentalModels = listOf(
                  "Pareto 80/20 Rule" to "80% of your results come from 20% of your efforts. Identify and double down on your highest-leverage 20%.",
                  "Parkinson's Law" to "Work expands to fill the time available for its completion. Set shorter, tighter deadlines to finish faster.",
                  "First Principles" to "Break complex problems down to their fundamental truths and build up from there, rather than copying others.",
                  "Inversion Model" to "Instead of asking how to succeed, ask 'What would guarantee failure?'—and systematically avoid those traps.",
                  "Occam's Razor" to "Among competing explanations, the simplest one with the fewest assumptions is usually the right one.",
                  "Goodhart's Law" to "When a measure becomes a target, it ceases to be a good measure. Focus on real value, not vanity metrics."
              )

              private val decks = mutableMapOf<String, ArrayDeque<Int>>()
              private fun <T> nextFromDeck(key: String, list: List<T>): T {
                  val queue = decks.getOrPut(key) { ArrayDeque() }
                  if (queue.isEmpty()) {
                      queue.addAll(list.indices.shuffled(Random.Default))
                  }
                  return list[queue.removeFirst()]
              }

              fun getWisdom(type: String = "random"): WisdomItem {
                  val chosen = if (type == "random") {
                      listOf("motivation", "time", "work", "trick", "bias", "maxim", "model").random()
                  } else type

                  return when (chosen) {
                      "motivation" -> WisdomItem("Motivation 🔥", null, nextFromDeck("mot", motivation))
                      "time" -> {
                          val cal = Calendar.getInstance()
                          val h24 = cal.get(Calendar.HOUR_OF_DAY)
                          val h12 = if (h24 % 12 == 0) 12 else h24 % 12
                          val min = String.format("%02d", cal.get(Calendar.MINUTE))
                          val ampm = if (h24 < 12) "AM" else "PM"
                          val msg = when {
                              h24 < 12 -> "It's $h12:$min $ampm. Prime morning focus window—tackle your #1 priority! ☀️"
                              h24 < 17 -> "It's $h12:$min $ampm. Afternoon power hours! Stay hydrated and sharp! 🚀"
                              else -> "It's $h12:$min $ampm. Wrap up your key goals and recharge your mind! 🌙"
                          }
                          WisdomItem("Time Check ⏰", null, msg)
                      }
                      "work" -> WisdomItem("Focus & Action 💼", null, nextFromDeck("work", workChecks))
                      "trick" -> {
                          val pair = nextFromDeck("trick", psychPrinciples)
                          WisdomItem("Psych Principle 🧠", pair.first, pair.second)
                      }
                      "bias" -> {
                          val pair = nextFromDeck("bias", cognitiveBiases)
                          WisdomItem("Cognitive Bias 📐", pair.first, pair.second)
                      }
                      "maxim" -> {
                          val pair = nextFromDeck("maxim", stoicMaxims)
                          WisdomItem("Stoic Maxim 🏛️", pair.first, pair.second)
                      }
                      else -> {
                          val pair = nextFromDeck("model", mentalModels)
                          WisdomItem("Mental Model ⚙️", pair.first, pair.second)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/companion/punchhole/CompanionOverlayView.kt
          package com.companion.punchhole

          import android.content.Context
          import android.graphics.*
          import android.os.SystemClock
          import android.text.Layout
          import android.text.SpannableStringBuilder
          import android.text.Spanned
          import android.text.StaticLayout
          import android.text.TextPaint
          import android.text.style.StyleSpan
          import android.view.Choreographer
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.*
          import kotlin.random.Random

          class CompanionOverlayView(
              context: Context,
              val isSystemOverlay: Boolean,
              var onStateChanged: ((Boolean) -> Unit)? = null
          ) : View(context), Choreographer.FrameCallback {

              enum class State { INSIDE, DROP_ROPE, SLIDE_DOWN, PERCHED, CLIMB_UP, RETRACT_ROPE }
              enum class CharType(val displayName: String, val accentColor: Int) {
                  NINJA("SHINOBI", Color.parseColor("#E01937")),
                  CAT("KURO NEKO", Color.parseColor("#F59E0B")),
                  BOT("BIBI BOT", Color.parseColor("#06B6D4")),
                  FOX("KITSUNE", Color.parseColor("#F97316"))
              }

              private val density = resources.displayMetrics.density
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val textPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#0F1429")
                  textSize = 11.5f * density
              }
              private val headerPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  textSize = 9.5f * density
                  typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
              }
              private val badgeTextPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  textSize = 9.5f * density
                  color = Color.argb(200, 255, 255, 255)
                  typeface = Typeface.MONOSPACE
              }
              private val path = Path()
              private val rectF = RectF()
              private val goldGradient = LinearGradient(
                  -5f, 0f, 5f, 0f,
                  intArrayOf(Color.parseColor("#B45309"), Color.parseColor("#FDE047"), Color.parseColor("#92400E")),
                  floatArrayOf(0f, 0.5f, 1f),
                  Shader.TileMode.CLAMP
              )

              var charMode: String = "rotate"
              var activeCharIdx: Int = 0
              var visitIntervalSec: Int = 120
              var visitCountdown: Int = 120
              var hangOutTimer: Int = 22
              var camTopOffsetDp: Float = 6f
              var camLeftOffsetDp: Float = 0f
              var targetRopeRatio: Float = 0.36f
              var bubbleDisplaySec: Int = 8
              var fallAnimationEnabled: Boolean = true
              var circleCutoutMode: Boolean = true
              var isLandscapePaused: Boolean = false

              var state: State = State.DROP_ROPE
                  private set
              private var ropeExtend = 0.02f
              private var ropeExtendVel = 0.035f
              private var slidePos = 0f
              private var slideVel = 0f
              private var ropeAngle = 0f
              private var ropeAngVel = 0f
              private var ropeStretch = 0f
              private var ropeStretchVel = 0f
              private var midRopeBow = 0f
              private var tasselAngle = 0f
              private var tasselAngVel = 0f

              var phoneTiltDeg = 0f
              private var smoothTiltRad = 0f
              private var slipBlend = 0f
              private var wasSlipping = false
              private var legSwingAngle = 0f
              private var legSwingVel = 0f
              private var landingSquash = 0f
              private var landingSquashVel = 0f

              private var simTime = 0f
              private var blinkTimer = 90
              private var blinkAmount = 0f
              private var gazeX = 0f
              private var targetGazeX = 0f
              private var gazeTimer = 110
              private val ribbonNodes = Array(8) { PointF(0f, 0f) }

              private var currentWisdom: WisdomItem? = null
              private var bubbleStartMs = 0L
              private var bubbleDurationMs = 8000L
              private var cachedStaticLayout: StaticLayout? = null
              private var loopActive = false
              private var lastSecondTickMs = SystemClock.elapsedRealtime()

              private val tickerRunnable = object : Runnable {
                  override fun run() {
                      onSecondTick()
                      postDelayed(this, 1000L)
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  lastSecondTickMs = SystemClock.elapsedRealtime()
                  post(tickerRunnable)
                  startLoop()
              }

              override fun onDetachedFromWindow() {
                  removeCallbacks(tickerRunnable)
                  stopLoop()
                  super.onDetachedFromWindow()
              }

              fun startLoop() {
                  if (!loopActive && !isLandscapePaused) {
                      loopActive = true
                      onStateChanged?.invoke(state != State.INSIDE)
                      Choreographer.getInstance().postFrameCallback(this)
                  }
              }

              private fun stopLoop() {
                  if (loopActive) {
                      loopActive = false
                      Choreographer.getInstance().removeFrameCallback(this)
                  }
              }

              override fun doFrame(frameTimeNanos: Long) {
                  if (!loopActive) return
                  updatePhysics()
                  invalidate()

                  if (state == State.INSIDE || isLandscapePaused) {
                      loopActive = false
                      onStateChanged?.invoke(false)
                      invalidate()
                      return
                  }
                  Choreographer.getInstance().postFrameCallback(this)
              }

              private fun onSecondTick() {
                  val now = SystemClock.elapsedRealtime()
                  val elapsedSec = max(1, ((now - lastSecondTickMs) / 1000L).toInt())
                  lastSecondTickMs = now
                  if (isLandscapePaused) return

                  if (visitIntervalSec <= 0) {
                      if (state == State.INSIDE) deployCompanion(false)
                      return
                  }

                  if (state == State.PERCHED) {
                      hangOutTimer -= elapsedSec
                      if (!isSystemOverlay) invalidate()
                      if (hangOutTimer <= 0) retractCompanion()
                  } else if (state == State.INSIDE) {
                      visitCountdown -= elapsedSec
                      if (!isSystemOverlay) invalidate()
                      if (visitCountdown <= 0) {
                          visitCountdown = visitIntervalSec
                          deployCompanion(true)
                          postDelayed({ speakWisdom("random") }, 1200L)
                      }
                  }
              }

              fun deployCompanion(advance: Boolean = false) {
                  if (isLandscapePaused) return
                  if (advance) {
                      activeCharIdx = if (charMode == "rotate") {
                          (activeCharIdx + 1) % CharType.values().size
                      } else {
                          charMode.toIntOrNull() ?: 0
                      }
                  }
                  state = State.DROP_ROPE
                  ropeExtend = 0.02f
                  ropeExtendVel = 0.035f
                  slidePos = 0f
                  slideVel = 0f
                  hangOutTimer = max(22, bubbleDisplaySec + 4)
                  lastSecondTickMs = SystemClock.elapsedRealtime()
                  onStateChanged?.invoke(true)
                  startLoop()
              }

              fun retractCompanion() {
                  currentWisdom = null
                  state = State.CLIMB_UP
                  slideVel = 0f
                  visitCountdown = visitIntervalSec
                  lastSecondTickMs = SystemClock.elapsedRealtime()
                  startLoop()
              }

              fun toggleCompanion() {
                  if (state == State.INSIDE || state == State.RETRACT_ROPE) deployCompanion(true) else retractCompanion()
              }

              fun speakWisdom(category: String = "random") {
                  if (state == State.INSIDE || state == State.RETRACT_ROPE || isLandscapePaused) return
                  val item = WisdomRepository.getWisdom(category)
                  currentWisdom = item
                  bubbleDurationMs = bubbleDisplaySec * 1000L
                  bubbleStartMs = SystemClock.elapsedRealtime()

                  val sb = SpannableStringBuilder()
                  if (item.title != null) {
                      sb.append(item.title).append(": ")
                      sb.setSpan(StyleSpan(Typeface.BOLD), 0, item.title.length + 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  }
                  sb.append(item.body)

                  val maxBubbleWidthPx = min((252f * density).toInt(), (width * 0.84f).toInt().coerceAtLeast(160))
                  cachedStaticLayout = StaticLayout.Builder.obtain(sb, 0, sb.length, textPaint, maxBubbleWidthPx)
                      .setAlignment(Layout.Alignment.ALIGN_NORMAL)
                      .setLineSpacing(0f, 1.15f)
                      .build()
                  startLoop()
              }

              private fun updatePhysics() {
                  simTime += 0.016f

                  when (state) {
                      State.DROP_ROPE -> {
                          ropeExtendVel += 0.0045f
                          ropeExtend += ropeExtendVel
                          if (ropeExtend >= 1f) {
                              ropeExtend = 1f
                              ropeExtendVel = 0f
                              ropeStretchVel = 2.6f
                              state = State.SLIDE_DOWN
                              slidePos = 0.04f
                              slideVel = 0.024f
                          }
                      }
                      State.SLIDE_DOWN -> {
                          val rem = 1f - slidePos
                          slideVel = min(0.052f, slideVel + 0.003f)
                          slidePos += min(slideVel, rem * 0.22f + 0.008f)
                          if (slidePos >= 0.995f) {
                              slidePos = 1f
                              state = State.PERCHED
                              landingSquashVel = 3.5f
                              ropeStretchVel = 4.0f
                              ropeAngVel += 0.013f
                              postDelayed({ if (state == State.PERCHED) speakWisdom("random") }, 400L)
                          }
                      }
                      State.CLIMB_UP -> {
                          slidePos -= 0.028f
                          ropeAngVel *= 0.9f
                          if (slidePos <= 0.02f) {
                              slidePos = 0f
                              state = State.RETRACT_ROPE
                          }
                      }
                      State.RETRACT_ROPE -> {
                          ropeExtend -= 0.085f
                          ropeAngle *= 0.8f
                          if (ropeExtend <= 0f) {
                              ropeExtend = 0f
                              state = State.INSIDE
                          }
                      }
                      State.PERCHED, State.INSIDE -> {}
                  }

                  if (state == State.INSIDE) return

                  val targetTiltRad = (phoneTiltDeg * PI.toFloat()) / 180f
                  smoothTiltRad += (targetTiltRad - smoothTiltRad) * 0.08f

                  val breeze = sin(simTime * 1.3f) * 0.00016f
                  val effectiveTargetAngle = smoothTiltRad * 0.36f
                  ropeAngVel += (-0.026f * (ropeAngle - effectiveTargetAngle) + breeze)
                  ropeAngVel *= 0.935f
                  ropeAngle = (ropeAngle + ropeAngVel).coerceIn(-0.30f, 0.30f)

                  midRopeBow += (-ropeAngVel * 135f - midRopeBow) * 0.18f

                  val tasselAccel = -0.04f * (tasselAngle - smoothTiltRad * 0.5f) - ropeAngVel * 0.35f
                  tasselAngVel = (tasselAngVel + tasselAccel) * 0.90f
                  tasselAngle += tasselAngVel

                  ropeStretchVel += -0.18f * ropeStretch - 0.22f * ropeStretchVel
                  ropeStretch += ropeStretchVel

                  landingSquashVel += -0.22f * landingSquash - 0.25f * landingSquashVel
                  landingSquash = (landingSquash + landingSquashVel).coerceIn(-3f, 14f)

                  val shouldSlip = fallAnimationEnabled && state == State.PERCHED && abs(phoneTiltDeg) >= 20f
                  if (shouldSlip && !wasSlipping) {
                      ropeStretchVel += 4.5f
                      ropeAngVel += if (phoneTiltDeg > 0) 0.01f else -0.01f
                  }
                  wasSlipping = shouldSlip
                  slipBlend += ((if (shouldSlip) 1f else 0f) - slipBlend) * 0.085f

                  val gravityLegTarget = smoothTiltRad * 0.55f + sin(simTime * 3.8f) * 0.16f
                  legSwingVel = (legSwingVel + (-0.045f * (legSwingAngle - gravityLegTarget) - ropeAngVel * 1.4f)) * 0.91f
                  legSwingAngle += legSwingVel

                  if (--blinkTimer <= 0) {
                      blinkAmount = min(1f, blinkAmount + 0.35f)
                      if (blinkTimer < -5) blinkTimer = 110 + Random.nextInt(140)
                  } else {
                      blinkAmount = max(0f, blinkAmount - 0.35f)
                  }

                  if (--gazeTimer <= 0) {
                      targetGazeX = (Random.nextFloat() - 0.5f) * 3.0f
                      gazeTimer = 90 + Random.nextInt(120)
                  }
                  gazeX += (targetGazeX - gazeX) * 0.12f
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (isLandscapePaused) return

                  val widthDp = width / density
                  val heightDp = height / density
                  val anchorX = widthDp / 2f + camLeftOffsetDp
                  val anchorY = camTopOffsetDp + 17f

                  canvas.save()
                  canvas.scale(density, density)

                  if (!isSystemOverlay) {
                      val pillW = if (circleCutoutMode) 35f else 126f
                      val pillH = 35f
                      paint.style = Paint.Style.FILL
                      paint.color = Color.parseColor("#050608")
                      rectF.set(anchorX - pillW / 2f, camTopOffsetDp, anchorX + pillW / 2f, camTopOffsetDp + pillH)
                      canvas.drawRoundRect(rectF, 999f, 999f, paint)

                      val lensX = if (circleCutoutMode) anchorX else anchorX + pillW / 2f - 16f
                      paint.color = Color.parseColor("#162038")
                      canvas.drawCircle(lensX, camTopOffsetDp + pillH / 2f, 6f, paint)

                      if (!circleCutoutMode) {
                          val badgeStr = when {
                              visitIntervalSec <= 0 -> "LIVE"
                              state == State.PERCHED -> "${max(0, hangOutTimer)}s"
                              state == State.INSIDE -> String.format("%d:%02d", max(0, visitCountdown) / 60, max(0, visitCountdown) % 60)
                              else -> "OUT"
                          }
                          canvas.save()
                          canvas.scale(1f / density, 1f / density)
                          canvas.drawText(badgeStr, (anchorX - pillW / 2f + 12f) * density, (camTopOffsetDp + 21f) * density, badgeTextPaint)
                          canvas.restore()
                      }
                  }

                  if (state == State.INSIDE) {
                      canvas.restore()
                      return
                  }

                  val maxRopeLen = heightDp * targetRopeRatio
                  val currentRopeLen = maxRopeLen * ropeExtend + ropeStretch
                  val sinA = sin(ropeAngle)
                  val cosA = cos(ropeAngle)
                  val knotX = anchorX + sinA * currentRopeLen
                  val knotY = anchorY + cosA * currentRopeLen
                  val midX = anchorX + sinA * (currentRopeLen * 0.5f) + cosA * midRopeBow
                  val midY = anchorY + cosA * (currentRopeLen * 0.5f) - sinA * midRopeBow

                  drawBraidedRopeAndKnot(canvas, anchorX, anchorY, midX, midY, knotX, knotY)

                  if (state == State.SLIDE_DOWN || state == State.PERCHED || state == State.CLIMB_UP) {
                      val char = CharType.values()[activeCharIdx.coerceIn(0, CharType.values().size - 1)]
                      val t = slidePos
                      val invT = 1f - t
                      val charX = invT * invT * anchorX + 2f * invT * t * midX + t * t * knotX
                      val charY = invT * invT * anchorY + 2f * invT * t * midY + t * t * knotY

                      drawCharacterPose(canvas, char, charX, charY, currentRopeLen)
                      drawSpeechBubbleIfVisible(canvas, char, charX, charY, widthDp)
                  }
                  canvas.restore()
              }

              private fun drawBraidedRopeAndKnot(canvas: Canvas, ax: Float, ay: Float, mx: Float, my: Float, kx: Float, ky: Float) {
                  paint.style = Paint.Style.STROKE
                  paint.strokeCap = Paint.Cap.ROUND

                  path.reset(); path.moveTo(ax + 2f, ay + 2f); path.quadTo(mx + 2f, my + 2f, kx + 2f, ky + 2f)
                  paint.color = Color.argb(72, 0, 0, 0); paint.strokeWidth = 5.5f
                  canvas.drawPath(path, paint)

                  path.reset(); path.moveTo(ax, ay); path.quadTo(mx, my, kx, ky)
                  paint.color = Color.parseColor("#141722"); paint.strokeWidth = 4.6f
                  canvas.drawPath(path, paint)

                  val ropeLen = hypot(kx - ax, ky - ay)
                  val steps = max(8, (ropeLen / 7f).toInt())
                  paint.color = Color.argb(56, 255, 255, 255); paint.strokeWidth = 1.3f
                  for (i in 1 until steps) {
                      val t = i.toFloat() / steps
                      val inv = 1f - t
                      val px = inv * inv * ax + 2f * inv * t * mx + t * t * kx
                      val py = inv * inv * ay + 2f * inv * t * my + t * t * ky
                      canvas.drawLine(px - 1.6f, py - 1.5f, px + 1.6f, py + 1.5f, paint)
                  }

                  canvas.save()
                  canvas.translate(kx, ky)
                  canvas.rotate(((-ropeAngle * 180f) / PI.toFloat()))

                  paint.style = Paint.Style.FILL; paint.shader = goldGradient
                  rectF.set(-4.8f, -5f, 4.8f, -0.5f); canvas.drawRoundRect(rectF, 2f, 2f, paint)
                  paint.shader = null

                  paint.color = Color.parseColor("#BE123C")
                  canvas.drawCircle(-4.2f, 2.5f, 4f, paint)
                  canvas.drawCircle(4.2f, 2.5f, 4f, paint)

                  paint.color = Color.parseColor("#E11D48")
                  rectF.set(-4.5f, -1f, 4.5f, 6.5f); canvas.drawRoundRect(rectF, 3.2f, 3.2f, paint)

                  paint.shader = goldGradient
                  rectF.set(-3.8f, 6.2f, 3.8f, 9.2f); canvas.drawRoundRect(rectF, 1.5f, 1.5f, paint)
                  paint.shader = null

                  canvas.save()
                  canvas.translate(0f, 8.5f)
                  canvas.rotate(((tasselAngle * 0.7f * 180f) / PI.toFloat()))
                  paint.style = Paint.Style.STROKE; paint.strokeWidth = 1.5f
                  val colors = intArrayOf(Color.parseColor("#9F1239"), Color.parseColor("#E11D48"), Color.parseColor("#FB7185"), Color.parseColor("#E11D48"), Color.parseColor("#9F1239"))
                  for (s in -2..2) {
                      val spread = s * 1.9f
                      val wave = sin(simTime * 4.5f + s) * 1.4f
                      paint.color = colors[s + 2]
                      path.reset(); path.moveTo(s * 0.8f, 0f); path.quadTo(spread * 0.7f + wave * 0.5f, 11f, spread + wave, 21f)
                      canvas.drawPath(path, paint)
                  }
                  canvas.restore()
                  canvas.restore()
              }

              private fun drawCharacterPose(canvas: Canvas, char: CharType, charX: Float, charY: Float, currentRopeLen: Float) {
                  val breathe = sin(simTime * 2.5f) * 1.2f
                  val climbCycle = sin(slidePos * 28f)
                  val activeTilt = if (fallAnimationEnabled) phoneTiltDeg else phoneTiltDeg * 0.25f
                  val balanceLean = (activeTilt / 20f).coerceIn(-1f, 1f) * 6.5f
                  val squash = landingSquash
                  val climbArmOffset = if (state == State.CLIMB_UP) climbCycle * 9f else 0f
                  val climbLegOffset = if (state == State.CLIMB_UP) -climbCycle * 8f else 0f
                  val slideTuck = if (state == State.SLIDE_DOWN) -5f else 0f

                  val tiltDir = if (phoneTiltDeg >= 0f) 1f else -1f
                  val hipSway = sin(legSwingAngle) * 14f
                  val kneeLag = sin(legSwingAngle - 0.35f) * 18f
                  val footLag = sin(legSwingAngle - 0.7f) * 24f
                  val scrambleKick = sin(simTime * 8.0f) * 4.5f
                  val handGrabEffort = sin(simTime * 5.0f) * 3.5f

                  val b = slipBlend
                  fun lerp(a: Float, c: Float) = a + (c - a) * b

                  val hipX = lerp(-15f + balanceLean * 0.65f, hipSway)
                  val hipY = lerp(-20f + squash * 0.85f + breathe * 0.5f, 27f)
                  val shoulderX = lerp(-12f + balanceLean, hipSway * 0.45f)
                  val shoulderY = lerp(-47f + squash * 0.55f + breathe, -1f)
                  val headX = lerp(-9f + balanceLean * 1.1f, hipSway * 0.3f + tiltDir * 2f)
                  val headY = lerp(-61f + squash * 0.55f + breathe, -15f)
                  val headTilt = lerp(0.08f + balanceLean * 0.018f, -0.16f * tiltDir)

                  val rElbowX = lerp(-4f, 3f * tiltDir + hipSway * 0.2f)
                  val rElbowY = lerp(-44f + squash * 0.3f, -13f)
                  val rHandX = 0f
                  val rHandY = lerp(-52f - climbArmOffset, -25f)

                  val lElbowX = lerp(if (state == State.PERCHED) -24f + balanceLean * 0.5f else -6f, -9f + hipSway * 0.3f)
                  val lElbowY = lerp(if (state == State.PERCHED) -33f + squash * 0.6f + breathe else -36f, -5f + handGrabEffort * 0.5f)
                  val lHandX = lerp(if (state == State.PERCHED) -20f else 0f, -2f + handGrabEffort * 0.4f)
                  val lHandY = lerp(if (state == State.PERCHED) -18f + squash * 0.5f else -36f + climbArmOffset, -17f + handGrabEffort)

                  val rKneeX = lerp(-5f, kneeLag + 3f)
                  val rKneeY = lerp(-10f + squash * 0.4f, 43f - abs(kneeLag) * 0.15f)
                  val rFootX = lerp(0f, footLag + 2f + scrambleKick)
                  val rFootY = lerp(2f + climbLegOffset, 59f - abs(footLag) * 0.2f + scrambleKick * 0.5f)

                  val lKneeX = lerp(-23f, kneeLag - 5f)
                  val lKneeY = lerp(-15f + squash * 0.5f + slideTuck, 40f - abs(kneeLag) * 0.15f)
                  val lFootX = lerp(-1f, footLag - 6f - scrambleKick)
                  val lFootY = lerp(-6f + slideTuck - climbLegOffset, 55f - abs(footLag) * 0.2f - scrambleKick * 0.5f)

                  val holeScale = min(1f, slidePos * 4.5f)
                  val rotAngle = -ropeAngle * (1f - b * 0.5f)
                  val limbColor = when (char) {
                      CharType.BOT -> Color.parseColor("#CBD5E1")
                      CharType.FOX -> Color.parseColor("#9A3412")
                      else -> Color.parseColor("#090B10")
                  }

                  if (char == CharType.NINJA && holeScale > 0.35f) {
                      val cosR = cos(rotAngle); val sinR = sin(rotAngle)
                      val lx = headX - 11f; val ly = headY - 2f
                      drawFlowingHeadband(canvas, charX + (lx * cosR - ly * sinR) * holeScale, charY + (lx * sinR + ly * cosR) * holeScale, ropeAngVel * currentRopeLen)
                  }

                  canvas.save()
                  canvas.translate(charX, charY)
                  canvas.scale(holeScale, holeScale)
                  canvas.rotate((rotAngle * 180f) / PI.toFloat())

                  drawSculptedLimb(canvas, shoulderX, shoulderY, rElbowX, rElbowY, rHandX, rHandY, 7.5f, 6.2f, 4.5f, limbColor)
                  paint.style = Paint.Style.FILL; paint.color = limbColor
                  canvas.drawCircle(rHandX, rHandY, 4.2f, paint)

                  drawSculptedLimb(canvas, hipX, hipY, rKneeX, rKneeY, rFootX, rFootY, 10.5f, 7.8f, 5.0f, limbColor)
                  drawNinjaFoot(canvas, rFootX, rFootY, rFootX + 8f, rFootY + 1f, limbColor)

                  drawCharacterTorso(canvas, char, hipX, hipY, shoulderX, shoulderY)

                  drawSculptedLimb(canvas, hipX, hipY, lKneeX, lKneeY, lFootX, lFootY, 11.0f, 8.2f, 5.2f, limbColor)
                  drawNinjaFoot(canvas, lFootX, lFootY, lFootX + 8f, lFootY - 1f, limbColor)

                  drawCharacterHead(canvas, char, headX, headY, headTilt, b > 0.45f)

                  drawSculptedLimb(canvas, shoulderX, shoulderY, lElbowX, lElbowY, lHandX, lHandY, 8.0f, 6.5f, 4.6f, limbColor)
                  paint.color = limbColor
                  canvas.drawCircle(lHandX, lHandY, 4.0f, paint)

                  canvas.restore()
              }

              private fun drawSculptedLimb(canvas: Canvas, x1: Float, y1: Float, x2: Float, y2: Float, x3: Float, y3: Float, wStart: Float, wMid: Float, wEnd: Float, color: Int) {
                  paint.style = Paint.Style.FILL; paint.color = color
                  drawTaperedSegment(canvas, x1, y1, x2, y2, wStart, wMid)
                  canvas.drawCircle(x2, y2, wMid * 0.5f, paint)
                  drawTaperedSegment(canvas, x2, y2, x3, y3, wMid * 1.04f, wEnd)
              }

              private fun drawTaperedSegment(canvas: Canvas, x1: Float, y1: Float, x2: Float, y2: Float, w1: Float, w2: Float) {
                  val dx = x2 - x1; val dy = y2 - y1
                  val len = hypot(dx, dy).coerceAtLeast(1f)
                  val nx = -dy / len; val ny = dx / len
                  val mx = (x1 + x2) * 0.5f + nx * (w1 - w2) * 0.12f
                  val my = (y1 + y2) * 0.5f + ny * (w1 - w2) * 0.12f
                  val mw = (w1 + w2) * 0.54f

                  path.reset()
                  path.moveTo(x1 + nx * w1 * 0.5f, y1 + ny * w1 * 0.5f)
                  path.quadTo(mx + nx * mw * 0.5f, my + ny * mw * 0.5f, x2 + nx * w2 * 0.5f, y2 + ny * w2 * 0.5f)
                  path.lineTo(x2 - nx * w2 * 0.5f, y2 - ny * w2 * 0.5f)
                  path.quadTo(mx - nx * mw * 0.5f, my - ny * mw * 0.5f, x1 - nx * w1 * 0.5f, y1 - ny * w1 * 0.5f)
                  path.close()
                  canvas.drawPath(path, paint)
              }

              private fun drawNinjaFoot(canvas: Canvas, ax: Float, ay: Float, tx: Float, ty: Float, color: Int) {
                  paint.style = Paint.Style.FILL; paint.color = color
                  path.reset(); path.moveTo(ax - 3.5f, ay); path.lineTo(ax + 3.5f, ay - 2f)
                  path.quadTo((ax + tx) * 0.5f + 2f, (ay + ty) * 0.5f - 3f, tx, ty)
                  path.quadTo((ax + tx) * 0.5f, ty + 3.5f, ax - 4f, ay + 3.5f); path.close()
                  canvas.drawPath(path, paint)
              }

              private fun drawCharacterTorso(canvas: Canvas, char: CharType, hipX: Float, hipY: Float, shoulderX: Float, shoulderY: Float) {
                  val dx = shoulderX - hipX; val dy = shoulderY - hipY
                  val angleRad = atan2(dy, dx) + (PI.toFloat() / 2f)
                  val tLen = hypot(dx, dy)

                  canvas.save()
                  canvas.translate(hipX, hipY)
                  canvas.rotate((angleRad * 180f) / PI.toFloat())

                  when (char) {
                      CharType.NINJA -> {
                          canvas.save()
                          canvas.translate(-4f, -tLen * 0.65f)
                          canvas.rotate((-0.48f * 180f) / PI.toFloat())
                          paint.style = Paint.Style.FILL; paint.color = Color.parseColor("#141722")
                          canvas.drawRect(-2.2f, -22f, 2.2f, 12f, paint)
                          paint.color = Color.parseColor("#FBBF24"); canvas.drawRect(-4.5f, -10f, 4.5f, -7.8f, paint)
                          paint.color = Color.parseColor("#E11D48"); canvas.drawRect(-1.2f, -19f, 1.2f, -16.6f, paint); canvas.drawRect(-1.2f, -15f, 1.2f, -12.6f, paint)
                          canvas.restore()
                      }
                      CharType.CAT -> {
                          val tailWave = sin(simTime * 3.6f) * 8f
                          paint.style = Paint.Style.STROKE; paint.strokeWidth = 5.2f; paint.strokeCap = Paint.Cap.ROUND
                          paint.color = Color.parseColor("#11131C"); path.reset(); path.moveTo(-4f, -2f)
                          path.cubicTo(-22f, -4f + tailWave * 0.5f, -28f, -22f + tailWave, -16f, -28f + tailWave)
                          canvas.drawPath(path, paint)
                      }
                      CharType.FOX -> {
                          val tailSway = sin(simTime * 3.0f) * 6f
                          canvas.save(); canvas.translate(-5f, -3f); canvas.rotate(((-0.35f + tailSway * 0.02f) * 180f) / PI.toFloat())
                          paint.style = Paint.Style.FILL; paint.color = Color.parseColor("#EA580C"); path.reset(); path.moveTo(0f, 0f)
                          path.quadTo(-18f, -14f, -26f, -4f); path.quadTo(-34f, 4f, -20f, 11f); path.quadTo(-8f, 9f, 0f, 0f); path.close()
                          canvas.drawPath(path, paint); paint.color = Color.parseColor("#FFFBEB"); canvas.drawCircle(-24f, 2f, 6.5f, paint)
                          canvas.restore()
                      }
                      CharType.BOT -> {}
                  }

                  paint.style = Paint.Style.FILL
                  paint.color = when (char) {
                      CharType.BOT -> Color.parseColor("#F8FAFC")
                      CharType.FOX -> Color.parseColor("#C2410C")
                      else -> Color.parseColor("#090B10")
                  }
                  path.reset(); path.moveTo(-6.5f, 2f); path.quadTo(-8.5f, -tLen * 0.5f, -9.5f, -tLen + 2f)
                  path.quadTo(0f, -tLen - 4f, 8.5f, -tLen + 2f); path.quadTo(7.5f, -tLen * 0.45f, 5.5f, 2f); path.quadTo(0f, 6f, -6.5f, 2f); path.close()
                  canvas.drawPath(path, paint)

                  when (char) {
                      CharType.BOT -> {
                          paint.color = Color.parseColor("#06B6D4"); canvas.drawCircle(1.5f, -tLen * 0.52f, 3.2f, paint)
                      }
                      CharType.CAT -> {
                          paint.color = Color.parseColor("#E11D48"); canvas.drawRect(-7f, -tLen + 1f, 7f, -tLen + 4.5f, paint)
                          paint.color = Color.parseColor("#FACC15"); canvas.drawCircle(2.5f, -tLen + 3.5f, 3.4f, paint)
                      }
                      else -> {
                          paint.color = if (char == CharType.FOX) Color.parseColor("#FBBF24") else Color.parseColor("#E11D48")
                          rectF.set(-6.8f, -4f, 6.2f, 0.2f); canvas.drawRoundRect(rectF, 2f, 2f, paint)
                      }
                  }
                  canvas.restore()
              }

              private fun drawCharacterHead(canvas: Canvas, char: CharType, hx: Float, hy: Float, headTilt: Float, isSlipping: Boolean) {
                  canvas.save(); canvas.translate(hx, hy); canvas.rotate((headTilt * 180f) / PI.toFloat())
                  val ex = 2.8f + gazeX * 0.6f; val ey = 2.0f
                  val eyeOpen = (1.0f - blinkAmount).coerceAtLeast(0.08f)
                  paint.style = Paint.Style.FILL

                  when (char) {
                      CharType.NINJA -> {
                          paint.color = Color.parseColor("#090B10"); canvas.drawRect(-3.8f, 8f, 3.8f, 16f, paint); canvas.drawCircle(0f, 0f, 12.8f, paint)
                          path.reset(); path.moveTo(-10f, -7f); path.lineTo(-15f, -11f); path.lineTo(-7f, -11f); path.lineTo(-11f, -15f); path.lineTo(-2f, -12.5f); path.close(); canvas.drawPath(path, paint)
                          paint.color = Color.parseColor("#E11D48"); path.reset(); path.moveTo(-12.6f, -4.5f); path.quadTo(1f, -6.5f, 12.6f, -3.5f); path.lineTo(12.8f, 1.2f); path.quadTo(1f, -1.5f, -12.8f, 0.5f); path.close(); canvas.drawPath(path, paint)
                          paint.color = Color.WHITE
                          if (isSlipping) {
                              rectF.set(ex - 6.1f, ey - 3f * eyeOpen, ex - 1.5f, ey + 3f * eyeOpen); canvas.drawOval(rectF, paint)
                              rectF.set(ex + 1.5f, ey - 3f * eyeOpen, ex + 6.1f, ey + 3f * eyeOpen); canvas.drawOval(rectF, paint)
                          } else {
                              drawSlantedEye(canvas, ex - 3.8f, ey, 4.6f, 2.7f * eyeOpen, 0.16f)
                              drawSlantedEye(canvas, ex + 3.8f, ey, 4.4f, 2.7f * eyeOpen, -0.12f)
                          }
                      }
                      CharType.CAT -> {
                          val earTwitch = sin(simTime * 5.5f) * 0.8f
                          paint.color = Color.parseColor("#090B10")
                          path.reset(); path.moveTo(-11f, -5f); path.lineTo(-13f, -19f + earTwitch); path.lineTo(-2f, -11f); path.close(); canvas.drawPath(path, paint)
                          path.reset(); path.moveTo(2f, -11f); path.lineTo(12f, -19f - earTwitch); path.lineTo(11f, -5f); path.close(); canvas.drawPath(path, paint)
                          paint.color = Color.parseColor("#FB7185")
                          path.reset(); path.moveTo(-9.5f, -7f); path.lineTo(-11f, -15f + earTwitch); path.lineTo(-4f, -10f); path.close(); canvas.drawPath(path, paint)
                          path.reset(); path.moveTo(4f, -10f); path.lineTo(10f, -15f - earTwitch); path.lineTo(9.5f, -7f); path.close(); canvas.drawPath(path, paint)
                          paint.color = Color.parseColor("#090B10"); rectF.set(-13.5f, -12.2f, 13.5f, 12.2f); canvas.drawOval(rectF, paint)
                          paint.color = Color.parseColor("#FDE047")
                          rectF.set(ex - 7.4f, ey - 3.6f * eyeOpen, ex - 1.0f, ey + 3.6f * eyeOpen); canvas.drawOval(rectF, paint)
                          rectF.set(ex + 1.0f, ey - 3.6f * eyeOpen, ex + 7.4f, ey + 3.6f * eyeOpen); canvas.drawOval(rectF, paint)
                      }
                      CharType.BOT -> {
                          val antBob = sin(simTime * 6f) * 1.5f
                          paint.style = Paint.Style.STROKE; paint.strokeWidth = 2f; paint.color = Color.parseColor("#94A3B8")
                          canvas.drawLine(0f, -12f, antBob, -19f, paint)
                          paint.style = Paint.Style.FILL; paint.color = Color.parseColor("#06B6D4"); canvas.drawCircle(antBob, -20f, 2.8f, paint)
                          paint.color = Color.parseColor("#F8FAFC"); rectF.set(-13.5f, -12f, 13.5f, 11f); canvas.drawRoundRect(rectF, 11f, 11f, paint)
                          paint.color = Color.parseColor("#0F172A"); rectF.set(-10.5f, -7.5f, 11.5f, 7f); canvas.drawRoundRect(rectF, 7f, 7f, paint)
                          paint.color = Color.parseColor("#22D3EE")
                          rectF.set(ex - 6.4f, ey - 0.5f - 3f * eyeOpen, ex - 1.6f, ey - 0.5f + 3f * eyeOpen); canvas.drawOval(rectF, paint)
                          rectF.set(ex + 1.6f, ey - 0.5f - 3f * eyeOpen, ex + 6.4f, ey - 0.5f + 3f * eyeOpen); canvas.drawOval(rectF, paint)
                      }
                      CharType.FOX -> {
                          paint.color = Color.parseColor("#EA580C")
                          path.reset(); path.moveTo(-11f, -5f); path.lineTo(-15f, -21f); path.lineTo(-2f, -11f); path.close(); canvas.drawPath(path, paint)
                          path.reset(); path.moveTo(2f, -11f); path.lineTo(14f, -21f); path.lineTo(11f, -5f); path.close(); canvas.drawPath(path, paint)
                          paint.color = Color.parseColor("#FFFBEB")
                          path.reset(); path.moveTo(-9f, -7f); path.lineTo(-12.5f, -17f); path.lineTo(-4f, -10f); path.close(); canvas.drawPath(path, paint)
                          path.reset(); path.moveTo(4f, -10f); path.lineTo(11.5f, -17f); path.lineTo(9f, -7f); path.close(); canvas.drawPath(path, paint)
                          paint.color = Color.parseColor("#EA580C"); canvas.drawCircle(0f, 0f, 12.8f, paint)
                          paint.color = Color.parseColor("#FFFBEB"); rectF.set(-12.5f, -0.7f, 0.5f, 9.7f); canvas.drawOval(rectF, paint); rectF.set(-0.5f, -0.7f, 12.5f, 9.7f); canvas.drawOval(rectF, paint)
                          paint.color = Color.parseColor("#FEF08A")
                          drawSlantedEye(canvas, ex - 3.8f, ey - 0.5f, 4.5f, 2.8f * eyeOpen, 0.15f)
                          drawSlantedEye(canvas, ex + 3.8f, ey - 0.5f, 4.5f, 2.8f * eyeOpen, -0.15f)
                      }
                  }
                  canvas.restore()
              }

              private fun drawSlantedEye(canvas: Canvas, x: Float, y: Float, w: Float, h: Float, slant: Float) {
                  canvas.save(); canvas.translate(x, y); canvas.rotate((slant * 180f) / PI.toFloat())
                  path.reset(); path.moveTo(-w * 0.5f, 0f); path.quadTo(0f, -h, w * 0.5f, -h * 0.2f); path.quadTo(0f, h * 0.85f, -w * 0.5f, 0f); path.close()
                  canvas.drawPath(path, paint); canvas.restore()
              }

              private fun drawFlowingHeadband(canvas: Canvas, knotX: Float, knotY: Float, charVelX: Float) {
                  ribbonNodes[0].set(knotX, knotY)
                  val windX = -5.2f - charVelX * 0.8f
                  val slideUpdraft = when (state) { State.SLIDE_DOWN -> -3.8f; State.CLIMB_UP -> 3.2f; else -> 0.6f }
                  for (i in 1 until ribbonNodes.size) {
                      val prev = ribbonNodes[i - 1]; val curr = ribbonNodes[i]
                      val wave = sin(simTime * 6.5f - i * 0.85f) * (1.2f + i * 0.35f)
                      curr.x += (prev.x + windX - curr.x) * 0.45f
                      curr.y += (prev.y + slideUpdraft + wave - curr.y) * 0.45f
                  }
                  drawTaperingRibbon(canvas, 5.5f, 0.8f, 2.2f, Color.parseColor("#9F1239"))
                  drawTaperingRibbon(canvas, 7.0f, -0.6f, -1.5f, Color.parseColor("#E11D48"))
                  paint.style = Paint.Style.FILL; paint.color = Color.parseColor("#BE123C"); canvas.drawCircle(knotX, knotY, 4.4f, paint)
              }

              private fun drawTaperingRibbon(canvas: Canvas, startWidth: Float, yOffsetStart: Float, yOffsetSpread: Float, color: Int) {
                  paint.style = Paint.Style.FILL; paint.color = color; path.reset()
                  val n = ribbonNodes.size
                  for (i in 0 until n) {
                      val t = i.toFloat() / (n - 1); val halfW = startWidth * (1f - t * 0.88f) * 0.5f
                      val px = ribbonNodes[i].x; val py = ribbonNodes[i].y + yOffsetStart + i * yOffsetSpread - halfW
                      if (i == 0) path.moveTo(px, py) else path.lineTo(px, py)
                  }
                  for (i in n - 1 downTo 0) {
                      val t = i.toFloat() / (n - 1); val halfW = startWidth * (1f - t * 0.88f) * 0.5f
                      val px = ribbonNodes[i].x; val py = ribbonNodes[i].y + yOffsetStart + i * yOffsetSpread + halfW
                      path.lineTo(px, py)
                  }
                  path.close(); canvas.drawPath(path, paint)
              }

              private fun drawSpeechBubbleIfVisible(canvas: Canvas, char: CharType, charX: Float, charY: Float, widthDp: Float) {
                  val wisdom = currentWisdom ?: return
                  val layout = cachedStaticLayout ?: return
                  val elapsed = SystemClock.elapsedRealtime() - bubbleStartMs
                  if (elapsed >= bubbleDurationMs) { currentWisdom = null; return }

                  val progress = (1f - elapsed.toFloat() / bubbleDurationMs).coerceIn(0f, 1f)
                  val textW = (layout.width / density)
                  val textH = (layout.height / density)
                  val boxW = textW + 28f
                  val boxH = textH + 38f

                  val clampedCenterX = charX.coerceIn(boxW / 2f + 8f, widthDp - boxW / 2f - 8f)
                  val bottomY = max(boxH + 14f, charY - 76f)
                  val leftX = clampedCenterX - boxW / 2f
                  val topY = bottomY - boxH

                  paint.style = Paint.Style.FILL; paint.color = Color.argb(65, 10, 14, 35)
                  rectF.set(leftX, topY + 4f, leftX + boxW, bottomY + 4f); canvas.drawRoundRect(rectF, 16f, 16f, paint)

                  paint.color = Color.argb(250, 255, 255, 255)
                  rectF.set(leftX, topY, leftX + boxW, bottomY); canvas.drawRoundRect(rectF, 16f, 16f, paint)

                  paint.color = char.accentColor
                  rectF.set(leftX + 10f, bottomY - 3.5f, leftX + 10f + (boxW - 20f) * progress, bottomY - 0.5f)
                  canvas.drawRoundRect(rectF, 2f, 2f, paint)

                  canvas.save()
                  canvas.scale(1f / density, 1f / density)
                  headerPaint.color = char.accentColor
                  canvas.drawText(char.displayName, (leftX + 14f) * density, (topY + 17f) * density, headerPaint)

                  headerPaint.color = Color.parseColor("#475569")
                  val catWidth = headerPaint.measureText(wisdom.categoryBadge)
                  canvas.drawText(wisdom.categoryBadge, (leftX + boxW - 14f) * density - catWidth, (topY + 17f) * density, headerPaint)

                  canvas.translate((leftX + 14f) * density, (topY + 24f) * density)
                  layout.draw(canvas)
                  canvas.restore()
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (isSystemOverlay) return false
                  if (event.action == MotionEvent.ACTION_DOWN) {
                      val tapXDp = event.x / density; val tapYDp = event.y / density
                      val widthDp = width / density; val heightDp = height / density
                      val anchorX = widthDp / 2f + camLeftOffsetDp; val anchorY = camTopOffsetDp + 17f

                      if (hypot(tapXDp - anchorX, tapYDp - anchorY) < 48f) {
                          toggleCompanion(); return true
                      }
                      if (state == State.PERCHED) {
                          val totalLen = heightDp * targetRopeRatio * ropeExtend + ropeStretch
                          val knotX = anchorX + sin(ropeAngle) * totalLen
                          val knotY = anchorY + cos(ropeAngle) * totalLen
                          if (hypot(tapXDp - knotX, tapYDp - (knotY - 30f)) < 68f) {
                              landingSquashVel = 2.2f
                              speakWisdom("random")
                              return true
                          }
                      }
                  }
                  return super.onTouchEvent(event)
              }
          }
