                      val cat = listOf("trick", "bias", "maxim", "model").random()
                      if (previewView.state == CompanionOverlayView.State.INSIDE) previewView.deployCompanion(false)
                      previewView.postDelayed({ previewView.speakWisdom(cat) }, 500L)
                  }
                  val motivateBtn = makeActionButton("Motivate 🔥", "#1AFFFFFF") {
                      val cat = listOf("motivation", "time", "work").random()
                      if (previewView.state == CompanionOverlayView.State.INSIDE) previewView.deployCompanion(false)
                      previewView.postDelayed({ previewView.speakWisdom(cat) }, 500L)
                  }
                  val gyroBtn = makeActionButton("Gyro ON", "#1AFFFFFF") {
                      gyroActive = !gyroActive
                      updateActivitySensor()
                  }
                  actRow.addView(inOutBtn, LinearLayout.LayoutParams(0, dp(36), 1f).apply { rightMargin = dp(5) })
                  actRow.addView(teachBtn, LinearLayout.LayoutParams(0, dp(36), 1f).apply { rightMargin = dp(5) })
                  actRow.addView(motivateBtn, LinearLayout.LayoutParams(0, dp(36), 1f).apply { rightMargin = dp(5) })
                  actRow.addView(gyroBtn, LinearLayout.LayoutParams(0, dp(36), 1f))
                  dock.addView(actRow)

                  val bottomRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(8), 0, 0)
                  }
                  overlayBtn = makeActionButton(
                      if (OverlayService.isRunning) "Stop Overlay ⏹️" else "Float Over Apps 📌",
                      "#10B981",
                      textColor = Color.parseColor("#052E16")
                  ) {
                      toggleSystemOverlay()
                  }
                  val batteryBtn = makeActionButton("Keep Alive ⚡", "#1AFFFFFF") {
                      requestBatteryExemption()
                  }
                  bottomRow.addView(overlayBtn, LinearLayout.LayoutParams(0, dp(38), 1.5f).apply { rightMargin = dp(6) })
                  bottomRow.addView(batteryBtn, LinearLayout.LayoutParams(0, dp(38), 1f))
                  dock.addView(bottomRow)

                  root.addView(dockScroll, FrameLayout.LayoutParams(
                      minOf(resources.displayMetrics.widthPixels - dp(20), dp(410)),
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                      bottomMargin = dp(16)
                  })

                  root.addView(restoreBtn, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.BOTTOM or Gravity.END
                      bottomMargin = dp(20)
                      rightMargin = dp(16)
                  })

                  setContentView(root)
              }

              private fun makeSectionLabel(txt: String): TextView {
                  return TextView(this).apply {
                      text = txt
                      setTextColor(Color.argb(210, 255, 255, 255))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, dp(6), 0, dp(3))
                  }
              }

              private fun makeActionButton(
                  label: String, bgHex: String, textColor: Int = Color.WHITE, onClick: () -> Unit
              ): Button {
                  return Button(this).apply {
                      text = label
                      setTextColor(textColor)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      setTypeface(typeface, Typeface.BOLD)
                      background = roundedBg(bgHex, "#24FFFFFF", 10f)
                      setOnClickListener { onClick() }
                  }
              }

              private fun addSlider(
                  parent: LinearLayout, title: String, minVal: Int, maxVal: Int, initVal: Int, unit: String, onChange: (Int) -> Unit
              ) {
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(4), 0, 0)
                  }
                  val labelTv = TextView(this).apply {
                      text = title
                      setTextColor(Color.argb(210, 255, 255, 255))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val valTv = TextView(this).apply {
                      text = "$initVal$unit"
                      setTextColor(Color.parseColor("#6EE7B7"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      setTypeface(typeface, Typeface.BOLD)
                  }
                  header.addView(labelTv)
                  header.addView(valTv)
                  parent.addView(header)

                  val seek = SeekBar(this).apply {
                      max = maxVal - minVal
                      progress = (initVal - minVal).coerceIn(0, maxVal - minVal)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, p: Int, fromUser: Boolean) {
                              val actual = minVal + p
                              valTv.text = "$actual$unit"
                              onChange(actual)
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                      })
                  }
                  parent.addView(seek)
              }

              private fun toggleSystemOverlay() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  val svc = Intent(this, OverlayService::class.java)
                  if (OverlayService.isRunning) {
                      prefs.edit().putBoolean("overlay_running", false).apply()
                      stopService(svc)
                      overlayBtn.text = "Float Over Apps 📌"
                  } else {
                      prefs.edit().putBoolean("overlay_running", true).apply()
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc) else startService(svc)
                      overlayBtn.text = "Stop Overlay ⏹️"
                  }
              }

              private fun requestBatteryExemption() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$packageName")
                          })
                      }
                  }
              }

              private fun updateActivitySensor() {
                  val sm = sensorManager ?: return
                  if (gyroActive) {
                      sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let {
                          sm.registerListener(this, it, SensorManager.SENSOR_DELAY_UI)
                      }
                  } else {
                      sm.unregisterListener(this)
                      previewView.phoneTiltDeg = 0f
                  }
              }

              override fun onResume() {
                  super.onResume()
                  overlayBtn.text = if (OverlayService.isRunning) "Stop Overlay ⏹️" else "Float Over Apps 📌"
                  if (gyroActive) updateActivitySensor()
              }

              override fun onPause() {
                  sensorManager?.unregisterListener(this)
                  super.onPause()
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_ACCELEROMETER) {
                      previewView.phoneTiltDeg = (-event.values[0] * 4.2f).coerceIn(-40f, 40f)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }
          EOF

      - name: Build Unsigned Release APK
        run: |
          chmod +x gradlew || true
          gradle assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Sign & Align Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-output
          KS_PASS="${KEYSTORE_PASSWORD:-companion123}"
          K_ALIAS="${KEY_ALIAS:-companion}"
          K_PASS="${KEY_PASSWORD:-companion123}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          else
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias "$K_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=PunchHoleCompanion, OU=Mobile, O=Companion, L=City, S=State, C=IN"
            base64 -w 0 release.jks > release-output/keystore-base64.txt
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="release-output/app-release-aligned.apk"
          SIGNED_APK="release-output/PunchHoleCompanion-release-signed.apk"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$K_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          rm -f "$ALIGNED_APK"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PunchHoleCompanion-Kotlin-Release-APK
          path: release-output/
