                  }
                  canvas.restore()
              }

              private fun drawSlantedEye(canvas: Canvas, x: Float, y: Float, w: Float, h: Float, slant: Float) {
                  canvas.save(); canvas.translate(x, y); canvas.rotate((slant * 180f) / PI.toFloat())
                  path.reset(); path.moveTo(-w * 0.5f, 0f); path.quadTo(0f, -h, w * 0.5f, -h * 0.2f); path.quadTo(0f, h * 0.85f, -w * 0.5f, 0f); path.close()
                  canvas.drawPath(path, paint); canvas.restore()
              }

              private fun drawFlowingHeadband(canvas: Canvas, knotX: Float, knotY: Float, charVelX: Float) {
                  ribbonNodes[0].set(knotX, knotY)
                  val windX = -5.2f - charVelX * 0.8f
                  val slideUpdraft = when (state) { State.SLIDE_DOWN -> -3.8f; State.CLIMB_UP -> 3.2f; else -> 0.6f }
                  for (i in 1 until ribbonNodes.size) {
                      val prev = ribbonNodes[i - 1]; val curr = ribbonNodes[i]
                      val wave = sin(simTime * 7.2f - i * 0.85f) * (1.4f + i * 0.4f)
                      curr.x += (prev.x + windX - curr.x) * 0.45f; curr.y += (prev.y + slideUpdraft + wave - curr.y) * 0.45f
                  }
                  drawTaperingRibbon(canvas, 5.5f, 0.8f, 2.2f, Color.parseColor("#9F1239"))
                  drawTaperingRibbon(canvas, 7.0f, -0.6f, -1.5f, Color.parseColor("#E11D48"))
                  paint.style = Paint.Style.FILL; paint.color = Color.parseColor("#BE123C"); canvas.drawCircle(knotX, knotY, 4.4f, paint)
              }

              private fun drawTaperingRibbon(canvas: Canvas, startWidth: Float, yOffsetStart: Float, yOffsetSpread: Float, color: Int) {
                  paint.style = Paint.Style.FILL; paint.color = color; path.reset()
                  val n = ribbonNodes.size
                  for (i in 0 until n) {
                      val t = i.toFloat() / (n - 1); val halfW = startWidth * (1f - t * 0.88f) * 0.5f
                      val px = ribbonNodes[i].x; val py = ribbonNodes[i].y + yOffsetStart + i * yOffsetSpread - halfW
                      if (i == 0) path.moveTo(px, py) else path.lineTo(px, py)
                  }
                  for (i in n - 1 downTo 0) {
                      val t = i.toFloat() / (n - 1); val halfW = startWidth * (1f - t * 0.88f) * 0.5f
                      val px = ribbonNodes[i].x; val py = ribbonNodes[i].y + yOffsetStart + i * yOffsetSpread + halfW
                      path.lineTo(px, py)
                  }
                  path.close(); canvas.drawPath(path, paint)
              }

              private fun drawSpeechBubbleBelowCharacter(canvas: Canvas, char: CharType, charXPx: Float, topYPx: Float) {
                  val wisdom = currentWisdom ?: return
                  val bodyLayout = cachedBodyLayout ?: return
                  val elapsed = SystemClock.elapsedRealtime() - bubbleStartMs
                  if (elapsed >= bubbleDurationMs) { currentWisdom = null; return }

                  val progress = (1f - elapsed.toFloat() / bubbleDurationMs).coerceIn(0f, 1f)
                  val padH = 16f * density; val padV = 14f * density; val headerH = 22f * density
                  val titleH = (cachedTitleLayout?.height?.toFloat() ?: 0f) + if (cachedTitleLayout != null) 6f * density else 0f
                  val footerH = 20f * density

                  val boxW = bodyLayout.width + padH * 2f
                  val boxH = padV * 2f + headerH + titleH + bodyLayout.height + footerH
                  val leftX = (charXPx - boxW / 2f).coerceIn(10f * density, (width - boxW - 10f * density).coerceAtLeast(10f * density))
                  val topY = topYPx.coerceAtLeast(95f * density)
                  val bottomY = topY + boxH

                  val pointerX = charXPx.coerceIn(leftX + 24f * density, leftX + boxW - 24f * density)
                  paint.style = Paint.Style.FILL; paint.color = Color.parseColor("#F20F172A")
                  path.reset(); path.moveTo(pointerX - 10f * density, topY + 1f); path.lineTo(pointerX, topY - 10f * density); path.lineTo(pointerX + 10f * density, topY + 1f); path.close(); canvas.drawPath(path, paint)

                  paint.color = Color.argb(110, 0, 0, 0)
                  rectF.set(leftX, topY + 5f * density, leftX + boxW, bottomY + 5f * density); canvas.drawRoundRect(rectF, 18f * density, 18f * density, paint)

                  paint.color = Color.parseColor("#F20F172A")
                  rectF.set(leftX, topY, leftX + boxW, bottomY); canvas.drawRoundRect(rectF, 18f * density, 18f * density, paint)

                  paint.style = Paint.Style.STROKE; paint.strokeWidth = 1.5f * density; paint.color = char.accentColor
                  canvas.drawRoundRect(rectF, 18f * density, 18f * density, paint)

                  paint.style = Paint.Style.FILL; headerPaint.color = char.accentColor
                  canvas.drawText(char.displayName, leftX + padH, topY + padV + 11f * density, headerPaint)

                  headerPaint.color = Color.parseColor("#CBD5E1")
                  val catW = headerPaint.measureText(wisdom.categoryBadge)
                  canvas.drawText(wisdom.categoryBadge, leftX + boxW - padH - catW, topY + padV + 11f * density, headerPaint)

                  var cursorY = topY + padV + headerH
                  cachedTitleLayout?.let { tLayout ->
                      canvas.save(); canvas.translate(leftX + padH, cursorY); titlePaint.color = char.accentColor; tLayout.draw(canvas); canvas.restore()
                      cursorY += tLayout.height + 6f * density
                  }
                  canvas.save(); canvas.translate(leftX + padH, cursorY); bodyLayout.draw(canvas); canvas.restore()

                  canvas.drawText("Tap friend: Trick & Next 💡  •  Double-tap: Hide", leftX + padH, bottomY - 10f * density, hintPaint)
                  paint.color = char.accentColor
                  rectF.set(leftX + padH, bottomY - 4.5f * density, leftX + padH + (boxW - padH * 2f) * progress, bottomY - 1.5f * density)
                  canvas.drawRoundRect(rectF, 2f * density, 2f * density, paint)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (isSystemOverlay) return false
                  return gestureDetector.onTouchEvent(event) || super.onTouchEvent(event)
              }
          }
