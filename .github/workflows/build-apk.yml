          package com.companion.punchhole

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.hardware.*
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager

          class OverlayService : Service(), SensorEventListener, SharedPreferences.OnSharedPreferenceChangeListener {

              companion object {
                  var isRunning = false
                  const val PREFS_NAME = "PunchHoleNativePrefs"
              }

              private lateinit var windowManager: WindowManager
              private lateinit var prefs: SharedPreferences
              private var companionView: CompanionOverlayView? = null
              private var sensorManager: SensorManager? = null

              private var isScreenOn = true
              private var isCompanionOut = true
              private var isPortrait = true
              private var sensorRegistered = false

              private val screenReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_SCREEN_OFF -> {
                              isScreenOn = false
                              updateSensorRegistration()
                          }
                          Intent.ACTION_SCREEN_ON -> {
                              isScreenOn = true
                              updateSensorRegistration()
                              companionView?.startLoop()
                          }
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  isRunning = true
                  prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                  prefs.edit().putBoolean("overlay_running", true).apply()
                  prefs.registerOnSharedPreferenceChangeListener(this)

                  startOverlayForeground()

                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_SCREEN_ON)
                  }
                  registerReceiver(screenReceiver, filter)

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  sensorManager = getSystemService(SENSOR_SERVICE) as SensorManager
                  isPortrait = resources.configuration.orientation != Configuration.ORIENTATION_LANDSCAPE

                  val dm = resources.displayMetrics
                  val widthPx = minOf(dm.widthPixels, (340 * dm.density).toInt())
                  val heightPx = (550 * dm.density).toInt()

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      widthPx,
                      heightPx,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          layoutInDisplayCutoutMode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                          } else {
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                          }
                      }
                  }

                  companionView = CompanionOverlayView(this, isSystemOverlay = true) { out ->
                      isCompanionOut = out
                      updateSensorRegistration()
                  }.also { view ->
                      syncPreferencesToView(view)
                      windowManager.addView(view, params)
                  }

                  updateSensorRegistration()
              }

              private fun syncPreferencesToView(view: CompanionOverlayView) {
                  view.charMode = prefs.getString("char_mode", "rotate") ?: "rotate"
                  if (view.charMode != "rotate") {
                      view.activeCharIdx = view.charMode.toIntOrNull() ?: 0
                  }
                  view.visitIntervalSec = prefs.getInt("visit_sec", 120)
                  view.camTopOffsetDp = prefs.getInt("cam_y", 6).toFloat()
                  view.camLeftOffsetDp = prefs.getInt("cam_x", 0).toFloat()
                  view.bubbleDisplaySec = prefs.getInt("read_sec", 8)
                  view.targetRopeRatio = prefs.getInt("rope_pct", 36) / 100f
                  view.fallAnimationEnabled = prefs.getBoolean("fall_on", true)
                  view.startLoop()
                  view.invalidate()
              }

              override fun onSharedPreferenceChanged(sharedPreferences: SharedPreferences?, key: String?) {
                  companionView?.let { syncPreferencesToView(it) }
              }

              private fun updateSensorRegistration() {
                  val sm = sensorManager ?: return
                  val shouldListen = isScreenOn && isCompanionOut && isPortrait
                  if (shouldListen && !sensorRegistered) {
                      sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let { accel ->
                          sm.registerListener(this, accel, SensorManager.SENSOR_DELAY_UI)
                          sensorRegistered = true
                      }
                  } else if (!shouldListen && sensorRegistered) {
                      sm.unregisterListener(this)
                      sensorRegistered = false
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  isPortrait = newConfig.orientation != Configuration.ORIENTATION_LANDSCAPE
                  companionView?.apply {
                      isLandscapePaused = !isPortrait
                      visibility = if (isPortrait) View.VISIBLE else View.GONE
                      if (isPortrait) startLoop()
                  }
                  updateSensorRegistration()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP_OVERLAY") {
                      prefs.edit().putBoolean("overlay_running", false).apply()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  return START_STICKY
              }

              private fun startOverlayForeground() {
                  val channelId = "punch_hole_native_channel"
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Punch Hole Companion Overlay",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      nm.createNotificationChannel(channel)
                  }

                  val openPending = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val stopIntent = Intent(this, OverlayService::class.java).apply { action = "STOP_OVERLAY" }
                  val stopPending = PendingIntent.getService(
                      this, 1, stopIntent, PendingIntent.FLAG_IMMUTABLE
                  )

                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }

                  val notification = builder
                      .setContentTitle("Punch Hole Companion Active")
                      .setContentText("Running natively at your front camera — Tap to adjust")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setContentIntent(openPending)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Stop Overlay", stopPending)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(101, notification)
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_ACCELEROMETER && isCompanionOut && isPortrait) {
                      companionView?.phoneTiltDeg = (-event.values[0] * 4.2f).coerceIn(-40f, 40f)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              override fun onDestroy() {
                  isRunning = false
                  prefs.unregisterOnSharedPreferenceChangeListener(this)
                  try { unregisterReceiver(screenReceiver) } catch (_: Exception) {}
                  if (sensorRegistered) {
                      sensorManager?.unregisterListener(this)
                      sensorRegistered = false
                  }
                  companionView?.let { windowManager.removeView(it) }
                  companionView = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
