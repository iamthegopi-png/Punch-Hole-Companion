name: Build Signed Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Align Android SDK Paths & Accept Licenses
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies & Add Android Platform
        run: |
          npm install
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Prepare & Generate Custom App Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
          mkdir -p assets

          if [ ! -f "assets/icon.png" ]; then
            cat << 'EOF' > assets/default-icon.svg
            <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#3f46cc"/>
                  <stop offset="50%" stop-color="#6370f5"/>
                  <stop offset="100%" stop-color="#1e2259"/>
                </linearGradient>
              </defs>
              <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
              <rect x="332" y="96" width="360" height="104" rx="52" fill="#050608"/>
              <circle cx="628" cy="148" r="24" fill="#1e2942"/>
              <line x1="512" y1="200" x2="512" y2="620" stroke="#141722" stroke-width="26" stroke-linecap="round"/>
              <circle cx="512" cy="540" r="150" fill="#090b10"/>
              <path d="M364 495 Q512 465 660 500 L660 555 Q512 525 364 550 Z" fill="#e11d48"/>
              <ellipse cx="465" cy="575" rx="34" ry="22" transform="rotate(10 465 575)" fill="#ffffff"/>
              <ellipse cx="565" cy="575" rx="34" ry="22" transform="rotate(-10 565 575)" fill="#ffffff"/>
              <circle cx="512" cy="640" r="28" fill="#e11d48"/>
            </svg>
          EOF
            rsvg-convert -w 1024 -h 1024 assets/default-icon.svg -o assets/icon.png
          fi

          convert assets/icon.png -resize 1024x1024\! assets/icon-only.png
          convert assets/icon.png -resize 1024x1024 -gravity center -background "#090b10" -extent 2732x2732 assets/splash.png
          cp assets/splash.png assets/splash-dark.png

          npx @capacitor/assets generate --android --iconBackgroundColor '#090b10' --iconBackgroundColorDark '#090b10' --splashBackgroundColor '#090b10' --splashBackgroundColorDark '#090b10'

      - name: Inject Cutout Fullscreen, Zero-Drain Sensor Overlay & Boot Receiver
        run: |
          PKG_DIR="android/app/src/main/java/com/companion/punchhole"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/BootReceiver.java"
          package com.companion.punchhole;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.provider.Settings;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      SharedPreferences prefs = context.getSharedPreferences("PunchHolePrefs", Context.MODE_PRIVATE);
                      boolean shouldRun = prefs.getBoolean("overlay_running", false);
                      if (shouldRun && (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(context))) {
                          Intent svc = new Intent(context, OverlayService.class);
                          svc.putExtra("query", prefs.getString("overlay_query", "overlay=1"));
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(svc);
                          } else {
                              context.startService(svc);
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/OverlayService.java"
          package com.companion.punchhole;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class OverlayService extends Service implements SensorEventListener {
              public static boolean isRunning = false;
              private WindowManager windowManager;
              private WebView webView;
              private SensorManager sensorManager;
              private SharedPreferences prefs;
              private String currentQuery = "overlay=1";

              private boolean isScreenOn = true;
              private boolean isCompanionOut = true;
              private boolean isPortrait = true;
              private boolean sensorRegistered = false;

              private final BroadcastReceiver screenReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (Intent.ACTION_SCREEN_OFF.equals(intent.getAction())) {
                          isScreenOn = false;
                          updateSensorRegistration();
                      } else if (Intent.ACTION_SCREEN_ON.equals(intent.getAction())) {
                          isScreenOn = true;
                          updateSensorRegistration();
                      }
                  }
              };

              @Override
              public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences("PunchHolePrefs", MODE_PRIVATE);
                  currentQuery = prefs.getString("overlay_query", "overlay=1");
                  prefs.edit().putBoolean("overlay_running", true).apply();
                  isRunning = true;
                  startOverlayForeground();

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(Intent.ACTION_SCREEN_OFF);
                  filter.addAction(Intent.ACTION_SCREEN_ON);
                  registerReceiver(screenReceiver, filter);

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  isPortrait = getResources().getConfiguration().orientation != Configuration.ORIENTATION_LANDSCAPE;
                  int widthPx = Math.min(dm.widthPixels, (int) (340 * dm.density));
                  int heightPx = (int) (540 * dm.density);

                  int layoutType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          widthPx,
                          heightPx,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      params.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.R
                              ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                              : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }

                  params.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  params.x = 0;
                  params.y = 0;

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  webView.setWebViewClient(new WebViewClient());
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  webView.addJavascriptInterface(new OverlayBridge(), "OverlayHost");

                  webView.loadUrl("file:///android_asset/public/index.html?" + currentQuery);
                  windowManager.addView(webView, params);

                  sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                  updateSensorRegistration();
              }

              private void updateSensorRegistration() {
                  if (sensorManager == null) return;
                  boolean shouldListen = isScreenOn && isCompanionOut && isPortrait;
                  if (shouldListen && !sensorRegistered) {
                      Sensor accel = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                      if (accel != null) {
                          sensorManager.registerListener(this, accel, SensorManager.SENSOR_DELAY_UI);
                          sensorRegistered = true;
                      }
                  } else if (!shouldListen && sensorRegistered) {
                      sensorManager.unregisterListener(this);
                      sensorRegistered = false;
                  }
              }

              public class OverlayBridge {
                  @JavascriptInterface
                  public void setCompanionOut(boolean out) {
                      isCompanionOut = out;
                      updateSensorRegistration();
                  }
              }

              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  isPortrait = newConfig.orientation != Configuration.ORIENTATION_LANDSCAPE;
                  if (webView != null) {
                      webView.post(() -> {
                          webView.setVisibility(isPortrait ? View.VISIBLE : View.GONE);
                          webView.evaluateJavascript("if(window.setLandscapeMode) window.setLandscapeMode(" + (!isPortrait) + ");", null);
                      });
                  }
                  updateSensorRegistration();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP_OVERLAY".equals(intent.getAction())) {
                      prefs.edit().putBoolean("overlay_running", false).apply();
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (intent != null) {
                      String q = intent.getStringExtra("query");
                      String liveJson = intent.getStringExtra("live_json");
                      if (q != null) {
                          currentQuery = q;
                          prefs.edit().putString("overlay_query", q).putBoolean("overlay_running", true).apply();
                      }
                      if (liveJson != null && webView != null) {
                          webView.post(() -> webView.evaluateJavascript("if(window.applyLiveConfig) window.applyLiveConfig(" + liveJson + ");", null));
                      } else if (q != null && webView != null && liveJson == null) {
                          webView.loadUrl("file:///android_asset/public/index.html?" + currentQuery);
                      }
                  }
                  return START_STICKY;
              }

              private void startOverlayForeground() {
                  String channelId = "punch_hole_companion_channel";
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel channel = new NotificationChannel(
                              channelId,
                              "Punch Hole Companion Overlay",
                              NotificationManager.IMPORTANCE_LOW
                      );
                      nm.createNotificationChannel(channel);
                  }

                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent openPending = PendingIntent.getActivity(
                          this, 0, openIntent, PendingIntent.FLAG_IMMUTABLE
                  );

                  Intent stopIntent = new Intent(this, OverlayService.class);
                  stopIntent.setAction("STOP_OVERLAY");
                  PendingIntent stopPending = PendingIntent.getService(
                          this, 1, stopIntent, PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, channelId)
                          : new Notification.Builder(this);

                  Notification notification = builder
                          .setContentTitle("Punch Hole Companion Active")
                          .setContentText("Running at your front camera — Tap to adjust")
                          .setSmallIcon(android.R.drawable.ic_menu_compass)
                          .setContentIntent(openPending)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Stop Overlay", stopPending)
                          .setOngoing(true)
                          .build();

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(101, notification);
                  }
              }

              @Override
              public void onSensorChanged(SensorEvent event) {
                  if (event.sensor.getType() == Sensor.TYPE_ACCELEROMETER && webView != null && isCompanionOut && isPortrait) {
                      float tiltDeg = Math.max(-40f, Math.min(40f, -event.values[0] * 4.2f));
                      webView.evaluateJavascript("if(window.setNativeTilt) window.setNativeTilt(" + tiltDeg + ");", null);
                  }
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) {}

              @Override
              public void onDestroy() {
                  isRunning = false;
                  try {
                      unregisterReceiver(screenReceiver);
                  } catch (Exception ignored) {}
                  if (sensorManager != null && sensorRegistered) {
                      sensorManager.unregisterListener(this);
                      sensorRegistered = false;
                  }
                  if (webView != null && windowManager != null) {
                      windowManager.removeView(webView);
                      webView.destroy();
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.companion.punchhole;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity implements SensorEventListener {
              private SensorManager sensorManager;
              private boolean sensorActive = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= Build.VERSION_CODES.R
                              ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                              : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  );

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView wv = getBridge().getWebView();
                      wv.setBackgroundColor(Color.TRANSPARENT);
                      wv.addJavascriptInterface(new NativeBridge(), "NativeApp");
                  }
                  sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().onResume();
                      getBridge().getWebView().resumeTimers();
                  }
              }

              @Override
              public void onSensorChanged(SensorEvent event) {
                  if (sensorActive && event.sensor.getType() == Sensor.TYPE_ACCELEROMETER && getBridge() != null) {
                      float tiltDeg = Math.max(-40f, Math.min(40f, -event.values[0] * 4.2f));
                      getBridge().getWebView().post(() ->
                          getBridge().getWebView().evaluateJavascript(
                              "if(window.setNativeTilt) window.setNativeTilt(" + tiltDeg + ");", null
                          )
                      );
                  }
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) {}

              public class NativeBridge {
                  @JavascriptInterface
                  public void toggleSystemOverlay(String query) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                          return;
                      }
                      SharedPreferences prefs = getSharedPreferences("PunchHolePrefs", MODE_PRIVATE);
                      Intent svc = new Intent(MainActivity.this, OverlayService.class);
                      if (OverlayService.isRunning) {
                          prefs.edit().putBoolean("overlay_running", false).apply();
                          stopService(svc);
                      } else {
                          prefs.edit().putString("overlay_query", query).putBoolean("overlay_running", true).apply();
                          svc.putExtra("query", query);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(svc);
                          } else {
                              startService(svc);
                          }
                      }
                  }

                  @JavascriptInterface
                  public void updateOverlayLive(String query, String jsonConfig) {
                      SharedPreferences prefs = getSharedPreferences("PunchHolePrefs", MODE_PRIVATE);
                      prefs.edit().putString("overlay_query", query).apply();
                      if (OverlayService.isRunning) {
                          Intent svc = new Intent(MainActivity.this, OverlayService.class);
                          svc.putExtra("query", query);
                          svc.putExtra("live_json", jsonConfig);
                          startService(svc);
                      }
                  }

                  @JavascriptInterface
                  public void updateOverlayQuery(String query) {
                      updateOverlayLive(query, null);
                  }

                  @JavascriptInterface
                  public boolean isOverlayRunning() {
                      return OverlayService.isRunning;
                  }

                  @JavascriptInterface
                  public void setSensorEnabled(boolean enabled) {
                      sensorActive = enabled;
                      if (sensorManager != null) {
                          Sensor accel = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                          if (enabled && accel != null) {
                              sensorManager.registerListener(MainActivity.this, accel, SensorManager.SENSOR_DELAY_UI);
                          } else {
                              sensorManager.unregisterListener(MainActivity.this);
                          }
                      }
                  }

                  @JavascriptInterface
                  public void requestBatteryExemption() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                              Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                          }
                      }
                  }
              }
          }
          EOF

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:configChanges="[^"]*"/android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|density|navigation" android:resizeableActivity="true"/' "$MANIFEST"
          sed -i 's/android:launchMode="[^"]*"/android:launchMode="singleTask"/' "$MANIFEST"
          sed -i 's/<application/<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" \/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <application/' "$MANIFEST"
          sed -i 's/<\/application>/    <service android:name=".OverlayService" android:exported="false" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize" android:foregroundServiceType="specialUse">\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="persistent_punch_hole_companion_overlay" \/>\n        <\/service>\n        <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" \/>\n            <\/intent-filter>\n        <\/receiver>\n    <\/application>/' "$MANIFEST"

      - name: Build Unsigned Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Sign & Align Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-output
          KS_PASS="${KEYSTORE_PASSWORD:-companion123}"
          K_ALIAS="${KEY_ALIAS:-companion}"
          K_PASS="${KEY_PASSWORD:-companion123}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using permanent keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          else
            echo "No KEYSTORE_BASE64 secret found. Generating a release keystore..."
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias "$K_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=PunchHoleCompanion, OU=Mobile, O=Companion, L=City, S=State, C=IN"

            base64 -w 0 release.jks > release-output/keystore-base64.txt
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="release-output/app-release-aligned.apk"
          SIGNED_APK="release-output/PunchHoleCompanion-release-signed.apk"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$K_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          rm -f "$ALIGNED_APK"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PunchHoleCompanion-Release-APK
          path: release-output/
