          package com.companion.punchhole

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.*
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import kotlin.math.abs
          import kotlin.math.roundToInt

          class OverlayService : Service(), SensorEventListener, SharedPreferences.OnSharedPreferenceChangeListener {

              companion object {
                  var isRunning = false
                  const val PREFS_NAME = "PunchHoleNativePrefs"
              }

              private lateinit var windowManager: WindowManager
              private lateinit var prefs: SharedPreferences
              private var companionView: CompanionOverlayView? = null
              private var punchHoleTouchView: View? = null
              private var characterTouchView: View? = null
              private lateinit var punchHoleParams: WindowManager.LayoutParams
              private lateinit var charTouchParams: WindowManager.LayoutParams
              private var sensorManager: SensorManager? = null

              private var isScreenOn = true
              private var isCompanionOut = true
              private var isPortrait = true
              private var sensorRegistered = false

              private val screenReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_SCREEN_OFF -> { isScreenOn = false; updateSensorRegistration() }
                          Intent.ACTION_SCREEN_ON -> { isScreenOn = true; updateSensorRegistration(); companionView?.startLoop() }
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  isRunning = true
                  prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                  prefs.edit().putBoolean("overlay_running", true).apply()
                  prefs.registerOnSharedPreferenceChangeListener(this)
                  startOverlayForeground()

                  registerReceiver(screenReceiver, IntentFilter().apply { addAction(Intent.ACTION_SCREEN_OFF); addAction(Intent.ACTION_SCREEN_ON) })
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  sensorManager = getSystemService(SENSOR_SERVICE) as SensorManager
                  isPortrait = resources.configuration.orientation != Configuration.ORIENTATION_LANDSCAPE

                  val dm = resources.displayMetrics; val density = dm.density
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

                  val visualParams = WindowManager.LayoutParams(
                      minOf(dm.widthPixels, (360 * density).toInt()), (620 * density).toInt(), layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; applyCutoutFlag(this) }

                  charTouchParams = WindowManager.LayoutParams(
                      (92 * density).toInt(), (105 * density).toInt(), layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; x = 0; y = (110 * density).toInt(); applyCutoutFlag(this) }

                  punchHoleParams = WindowManager.LayoutParams(
                      (64 * density).toInt(), (48 * density).toInt(), layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = (prefs.getInt("cam_x", 0) * density).roundToInt()
                      y = (prefs.getInt("cam_y", 6) * density).roundToInt()
                      applyCutoutFlag(this)
                  }

                  companionView = CompanionOverlayView(
                      this, isSystemOverlay = true,
                      onStateChanged = { out ->
                          isCompanionOut = out
                          updateSensorRegistration()
                          characterTouchView?.post { characterTouchView?.visibility = if (out && isPortrait) View.VISIBLE else View.GONE }
                      },
                      onCharacterBoundsUpdated = { offsetXDp, topYDp, active ->
                          characterTouchView?.let { v ->
                              val targetVis = if (active && isPortrait) View.VISIBLE else View.GONE
                              if (v.visibility != targetVis) v.visibility = targetVis
                              if (active && isPortrait) {
                                  val newX = (offsetXDp * density).roundToInt()
                                  val newY = (topYDp * density).roundToInt().coerceAtLeast((48 * density).toInt())
                                  if (abs(charTouchParams.x - newX) > 6 || abs(charTouchParams.y - newY) > 6) {
                                      charTouchParams.x = newX; charTouchParams.y = newY
                                      try { windowManager.updateViewLayout(v, charTouchParams) } catch (_: Exception) {}
                                  }
                              }
                          }
                      }
                  ).also { view -> syncPreferencesToView(view); windowManager.addView(view, visualParams) }

                  val charGesture = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean = true
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean { companionView?.onCharacterSingleTap(); return true }
                      override fun onDoubleTap(e: MotionEvent): Boolean { companionView?.retractCompanion(); return true }
                      override fun onScroll(e1: MotionEvent?, e2: MotionEvent, dx: Float, dy: Float): Boolean { companionView?.applyHorizontalImpulse(-dx); return true }
                  })
                  characterTouchView = View(this).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                      setOnTouchListener { _, event -> charGesture.onTouchEvent(event) }
                  }.also { windowManager.addView(it, charTouchParams) }

                  val holeGesture = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean = true
                      override fun onSingleTapUp(e: MotionEvent): Boolean { companionView?.toggleCompanion(); return true }
                  })
                  punchHoleTouchView = View(this).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                      setOnTouchListener { _, event -> holeGesture.onTouchEvent(event) }
                  }.also { windowManager.addView(it, punchHoleParams) }

                  updateSensorRegistration()
              }

              private fun applyCutoutFlag(lp: WindowManager.LayoutParams) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      lp.layoutInDisplayCutoutMode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS else WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
              }

              private fun syncPreferencesToView(view: CompanionOverlayView) {
                  val density = resources.displayMetrics.density
                  view.charMode = prefs.getString("char_mode", "rotate") ?: "rotate"
                  if (view.charMode != "rotate") view.activeCharIdx = view.charMode.toIntOrNull() ?: 0
                  view.visitIntervalSec = prefs.getInt("visit_sec", 120)
                  view.camTopOffsetDp = prefs.getInt("cam_y", 6).toFloat()
                  view.camLeftOffsetDp = prefs.getInt("cam_x", 0).toFloat()
                  view.bubbleDisplaySec = prefs.getInt("read_sec", 9)
                  view.textSizeSp = prefs.getInt("text_sp", 16)
                  view.targetRopeRatio = prefs.getInt("rope_pct", 28) / 100f
                  view.fallAnimationEnabled = prefs.getBoolean("fall_on", true)
                  view.quotesEnabled = prefs.getBoolean("quotes_on", true)
                  view.rebuildBubbleLayouts()
                  view.startLoop()
                  view.invalidate()

                  punchHoleTouchView?.let { hv ->
                      punchHoleParams.x = (view.camLeftOffsetDp * density).roundToInt()
                      punchHoleParams.y = (view.camTopOffsetDp * density).roundToInt()
                      try { windowManager.updateViewLayout(hv, punchHoleParams) } catch (_: Exception) {}
                  }
              }

              override fun onSharedPreferenceChanged(sharedPreferences: SharedPreferences?, key: String?) { companionView?.let { syncPreferencesToView(it) } }

              private fun updateSensorRegistration() {
                  val sm = sensorManager ?: return
                  val shouldListen = isScreenOn && isCompanionOut && isPortrait
                  if (shouldListen && !sensorRegistered) {
                      sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_UI); sensorRegistered = true }
                  } else if (!shouldListen && sensorRegistered) {
                      sm.unregisterListener(this); sensorRegistered = false
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  isPortrait = newConfig.orientation != Configuration.ORIENTATION_LANDSCAPE
                  companionView?.apply { isLandscapePaused = !isPortrait; visibility = if (isPortrait) View.VISIBLE else View.GONE; if (isPortrait) startLoop() }
                  punchHoleTouchView?.visibility = if (isPortrait) View.VISIBLE else View.GONE
                  characterTouchView?.visibility = if (isPortrait && isCompanionOut) View.VISIBLE else View.GONE
                  updateSensorRegistration()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP_OVERLAY") { prefs.edit().putBoolean("overlay_running", false).apply(); stopSelf(); return START_NOT_STICKY }
                  return START_STICKY
              }

              private fun startOverlayForeground() {
                  val channelId = "punch_hole_native_channel"
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(NotificationChannel(channelId, "Punch Hole Companion Overlay", NotificationManager.IMPORTANCE_LOW))
                  }
                  val openPending = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val stopPending = PendingIntent.getService(this, 1, Intent(this, OverlayService::class.java).apply { action = "STOP_OVERLAY" }, PendingIntent.FLAG_IMMUTABLE)
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, channelId) else @Suppress("DEPRECATION") Notification.Builder(this)
                  val notification = builder
                      .setContentTitle("Punch Hole Companion Active")
                      .setContentText("Tap camera hole to summon/hide • Tap friend for tricks")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setContentIntent(openPending)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Stop Overlay", stopPending)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE) else startForeground(101, notification)
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_ACCELEROMETER && isCompanionOut && isPortrait) {
                      companionView?.phoneTiltDeg = (-event.values[0] * 4.2f).coerceIn(-40f, 40f)
                  }
              }
              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              override fun onDestroy() {
                  isRunning = false
                  prefs.unregisterOnSharedPreferenceChangeListener(this)
                  try { unregisterReceiver(screenReceiver) } catch (_: Exception) {}
                  if (sensorRegistered) { sensorManager?.unregisterListener(this); sensorRegistered = false }
                  companionView?.let { try { windowManager.removeView(it) } catch (_: Exception) {} }
                  characterTouchView?.let { try { windowManager.removeView(it) } catch (_: Exception) {} }
                  punchHoleTouchView?.let { try { windowManager.removeView(it) } catch (_: Exception) {} }
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
